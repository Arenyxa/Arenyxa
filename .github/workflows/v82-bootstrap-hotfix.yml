name: v8.2 Bootstrap Services Hotfix

on:
  push:
    branches:
      - release/v8.2
    paths:
      - .github/workflows/v82-bootstrap-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v8.2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply exact bootstrap dependency repair
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/arenyxa/bootstrap_services.py')
          text = path.read_text(encoding='utf-8')
          anchor = 'from arenyxa.application.runner import RunOrchestrator\n'
          insertion = anchor + 'from arenyxa.application.runner_support import RunHandle\n'
          if insertion not in text:
              if text.count(anchor) != 1:
                  raise SystemExit(f'expected exactly one runner import anchor, found {text.count(anchor)}')
              text = text.replace(anchor, insertion, 1)
              path.write_text(text, encoding='utf-8', newline='\n')
          verify = path.read_text(encoding='utf-8')
          if 'from arenyxa.application.runner_support import RunHandle\n' not in verify:
              raise SystemExit('RunHandle import repair did not persist')
      - name: Verify syntax and Ruff undefined-name contract
        run: |
          python -m pip install --disable-pip-version-check ruff==0.12.12
          python -m compileall -q src/arenyxa/bootstrap_services.py
          ruff check src/arenyxa/bootstrap_services.py --select F821
      - name: Commit repair and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'Arenyxa Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/v82-bootstrap-hotfix.yml
          git add src/arenyxa/bootstrap_services.py
          git diff --cached --check
          git commit -m 'fix: restore bootstrap RunHandle dependency'
          git push origin HEAD:release/v8.2
