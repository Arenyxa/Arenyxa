name: Arenyxa Phase3 P99 Attribution

on:
  push:
    branches: ["phase3/p99-firstuse-warmtail-20260912"]
  workflow_dispatch:

permissions:
  contents: read

env:
  ARENYXA_POSTGRES_TEST_DSN: postgresql://arenyxa:arenyxa_ci@127.0.0.1:5432/arenyxa_ci

jobs:
  database-firstuse:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: arenyxa
          POSTGRES_PASSWORD: arenyxa_ci
          POSTGRES_DB: arenyxa_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U arenyxa -d arenyxa_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - name: Materialize verified Phase2 diagnostic base
        run: |
          set -euo pipefail
          tar -tzf .github/phase2/timed-window-harness.tar.gz >/dev/null
          tar -xzf .github/phase2/timed-window-harness.tar.gz -C .github/phase2
      - name: Freeze host and source
        run: .github/phase2/experiment_preflight.sh phase3a
      - uses: actions/setup-python@v6
        with: {python-version: "3.11", cache: pip}
      - name: Install fixed dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,database]" psutil
          python - <<'PY'
          import psycopg, psycopg_pool, psutil, sys
          assert sys.version_info[:3] == (3,11,16)
          assert psycopg.__version__ == '3.3.5'
          assert psycopg_pool.__version__ == '3.3.1'
          print('psycopg', psycopg.__version__, 'pool', psycopg_pool.__version__, 'psutil', psutil.__version__)
          PY
      - name: Configure service PostgreSQL contract for final recheck
        run: .github/phase2/configure_pg.sh phase3a
      - name: Validate Phase3A diagnostics
        run: python -m py_compile .github/phase3/phase3_db_decomp.py .github/phase2/timed_state_isolation.py
      - name: Run paired A0 A1 replication and S1 S4 decomposition
        run: PYTHONPATH="$GITHUB_WORKSPACE" python .github/phase3/phase3_db_decomp.py --out phase3a
      - name: Final frozen-state recheck
        if: always()
        run: .github/phase2/final_recheck.sh phase3a
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: phase3-database-firstuse
          path: phase3a
          retention-days: 7

  warm-lease-tail:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: arenyxa
          POSTGRES_PASSWORD: arenyxa_ci
          POSTGRES_DB: arenyxa_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U arenyxa -d arenyxa_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - name: Materialize verified Phase2 diagnostic base
        run: |
          set -euo pipefail
          tar -tzf .github/phase2/timed-window-harness.tar.gz >/dev/null
          tar -xzf .github/phase2/timed-window-harness.tar.gz -C .github/phase2
      - name: Freeze host and source
        run: .github/phase2/experiment_preflight.sh phase3b
      - uses: actions/setup-python@v6
        with: {python-version: "3.11", cache: pip}
      - name: Install fixed dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,database]" psutil
      - name: Configure PostgreSQL contract
        run: .github/phase2/configure_pg.sh phase3b
      - name: Validate Phase3B diagnostics
        run: python -m py_compile .github/phase3/phase3_warmtail.py
      - name: Run warm-state lease-tail collection
        run: PYTHONPATH="$GITHUB_WORKSPACE" python .github/phase3/phase3_warmtail.py --dsn "$ARENYXA_POSTGRES_TEST_DSN" --out phase3b
      - name: Final frozen-state recheck
        if: always()
        run: .github/phase2/final_recheck.sh phase3b
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: phase3-warm-lease-tail
          path: phase3b
          retention-days: 7
