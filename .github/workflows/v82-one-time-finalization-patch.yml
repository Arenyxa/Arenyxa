name: Arenyxa v8.2 One-Time Finalization Patch

on:
  push:
    branches: ["release/v8.2-finalization"]

permissions:
  contents: write
  actions: write

jobs:
  validate-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arenyxa
          POSTGRES_PASSWORD: arenyxa_ci
          POSTGRES_DB: arenyxa_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arenyxa -d arenyxa_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ARENYXA_POSTGRES_TEST_DSN: postgresql://arenyxa:arenyxa_ci@127.0.0.1:5432/arenyxa_ci
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/v8.2-finalization
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,database]"

      - name: Apply exact release-blocker repairs in working tree
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact replacement target, found {count}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          # Fully warm the already-bounded per-client PostgreSQL pool.  This keeps
          # the checkout health check/failover contract while removing lazy
          # connection creation from normal high-concurrency job execution.
          replace_once(
              "src/arenyxa/enterprise/runtime_storage.py",
              "            min_size=4,\n            max_size=8,",
              "            min_size=8,\n            max_size=8,",
          )
          replace_once(
              "tests/test_v71_postgresql_pool_contract.py",
              '    assert pool.kwargs["min_size"] == 4',
              '    assert pool.kwargs["min_size"] == 8',
          )

          stability = Path("tests/test_v811_postgresql_stability.py")
          text = stability.read_text(encoding="utf-8")
          replacements = {
              "return all four sockets to the idle pool.": "return every socket in the warm pool to the idle pool.",
              "        for _index in range(4):": "        for _index in range(8):",
              "        assert len(terminated_pids) == 4": "        assert len(terminated_pids) == 8",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"stability contract target mismatch: {old!r}")
              text = text.replace(old, new)
          stability.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/industrialization.yml")
          text = workflow.read_text(encoding="utf-8")
          step = "      - name: PostgreSQL 64-worker / 128-concurrency no-storm gate\n"
          start = text.find(step)
          end = text.find("      - uses: actions/upload-artifact@v6\n", start)
          if start < 0 or end < 0:
              raise SystemExit("industrialization PostgreSQL gate block not found")
          strict = (
              step
              + "        run: python scripts/postgresql_64_worker_128_concurrency_gate.py --jobs 1024 --report POSTGRES_64W_128C_GATE.json\n"
          )
          workflow.write_text(text[:start] + strict + text[end:], encoding="utf-8")

          phase3 = Path("tests/test_phase3_reliability_resource_governance.py")
          text = phase3.read_text(encoding="utf-8")
          marker = "def test_startup_visual_implementation_matches_current_approved_baseline() -> None:\n"
          before, found, tail = text.partition(marker)
          if not found or "04488fec32a69741b93dcf5b5806108acc3f265f1ea7cdf2930552190bca77ae" not in tail:
              raise SystemExit("startup visual byte-hash contract was not the expected baseline")
          replacement = '''def test_startup_visual_implementation_matches_current_approved_baseline() -> None:
              import hashlib

              from arenyxa.presentation.startup_motion_math import (
                  exit_duration_ms,
                  frame_interval_ms,
                  handoff_visuals,
                  reveal_radius,
                  startup_progress_duration_ms,
              )

              root = Path(__file__).resolve().parents[1]
              splash = root / "src/arenyxa/presentation/startup_splash.py"
              assert hashlib.sha256(splash.read_bytes()).hexdigest() == (
                  "46141636071f7adedabbb8ddacc7faaa9381bfdbc059712a72a85ab6ebea0b33"
              )

              # Motion math is a behavioral contract: comments/formatting must not make a
              # Windows release fail while the approved animation semantics are unchanged.
              assert handoff_visuals(0.0, allow_scale=True) == pytest.approx((1.0, 1.0, 0.0))
              assert handoff_visuals(1.0, allow_scale=True) == pytest.approx((1.92, 0.0, 1.0))
              assert handoff_visuals(1.0, allow_scale=False) == pytest.approx((1.0, 0.0, 1.0))
              assert reveal_radius(6.0, 8.0, 1.0) == pytest.approx(7.0)
              assert frame_interval_ms(60.0) == 16
              assert frame_interval_ms(float("nan")) == 16
              assert frame_interval_ms(1.0) == 33
              assert frame_interval_ms(1000.0) == 4
              assert exit_duration_ms("efficiency") == 360
              assert exit_duration_ms("balanced") == 520
              assert exit_duration_ms("quality") == 600
              assert startup_progress_duration_ms(50.0, 50.0) == 0
              assert startup_progress_duration_ms(0.0, 10.0) == 90
          '''
          # The function is the final test in this file; dedent the literal's
          # source indentation without changing the generated Python semantics.
          import textwrap
          phase3.write_text(before + textwrap.dedent(replacement), encoding="utf-8")
          PY

      - name: Deterministic targeted regressions
        run: >-
          python -m pytest -q
          tests/test_v71_postgresql_pool_contract.py
          tests/test_phase3_reliability_resource_governance.py::test_startup_visual_implementation_matches_current_approved_baseline

      - name: Configure PostgreSQL stress capacity
        run: |
          POSTGRES_CONTAINER="$(docker ps --format '{{.ID}} {{.Image}}' | awk '$2 ~ /^postgres:/ {print $1; exit}')"
          test -n "$POSTGRES_CONTAINER"
          docker exec "$POSTGRES_CONTAINER" psql -U arenyxa -d arenyxa_ci -c "ALTER SYSTEM SET max_connections = '256';"
          docker restart "$POSTGRES_CONTAINER"
          READY=0
          for i in $(seq 1 30); do
            if docker exec "$POSTGRES_CONTAINER" pg_isready -U arenyxa -d arenyxa_ci; then READY=1; break; fi
            sleep 2
          done
          test "$READY" -eq 1
          test "$(docker exec "$POSTGRES_CONTAINER" psql -U arenyxa -d arenyxa_ci -Atc "SHOW max_connections;")" = "256"

      - name: PostgreSQL idle-connection recovery regression
        run: python -m pytest -q tests/test_v811_postgresql_stability.py::test_postgresql_pool_discards_server_terminated_idle_connections

      - name: Strict single-run 64W 128C 1024J P99 falsification
        run: python scripts/postgresql_64_worker_128_concurrency_gate.py --jobs 1024 --report POSTGRES_64W_128C_GATE.json

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v82-pool-candidate-p99
          path: POSTGRES_64W_128C_GATE.json

      - name: Regenerate repair integrity metadata
        run: |
          python scripts/build_source_repair_seed.py
          rm .github/workflows/v82-one-time-finalization-patch.yml
          python scripts/build_source_manifest.py
          python -m pytest -q tests/test_source_manifest.py
          git diff --check

      - name: Commit verified candidate and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "fix: close v8.2 release performance and Windows gate blockers"
          git push origin HEAD:release/v8.2-finalization

      - name: Dispatch authoritative industrialization gates on patched commit
        run: gh workflow run industrialization.yml --ref release/v8.2-finalization
