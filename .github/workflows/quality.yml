name: Arenyxa Quality

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arenyxa-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-quality:
    name: Core Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ARENYXA_CI_FORBID_ENVIRONMENT_SKIPS: "1"
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install lightweight development runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,analysis]"
      - name: Assert static-analysis environment
        run: python scripts/ci_environment_gate.py --require-static
      - name: Release-blocking static quality
        run: python scripts/static_quality_gate.py
      - name: Workflow producer/runtime contract gate
        run: python scripts/workflow_contract_gate.py
      - name: Historical shadow compatibility
        run: python -m pytest -q tests/test_shadow_compatibility.py tests/test_workflow_contract_gate.py
      - name: Architecture and release identity gates
        run: |
          python scripts/architecture_debt_gate.py
          python scripts/verify_v81_release_identity.py
      - name: Core headless regression
        run: >-
          python -m pytest -q
          tests/test_v78_architecture_consolidation.py
          tests/test_phase1_architecture_contracts.py
          tests/test_async_runtime_boundaries.py
          tests/test_concurrent_scraping.py
          tests/test_crawler_engine.py
          tests/test_deep_runtime_resilience.py
      - name: P0/P1 state-space and critical coverage
        run: |
          python -m pytest -q \
            tests/test_v78_p0_p1_closure.py \
            tests/test_v70_distributed_fault_matrix.py \
            tests/test_distributed_state_consistency_hardening.py \
            tests/test_protocol_intelligence_depth.py \
            tests/test_v78_architecture_consolidation.py \
            --cov=arenyxa.enterprise.distributed_queue \
            --cov=arenyxa.infrastructure.capture.tcp_reassembly \
            --cov=arenyxa.application.async_runner \
            --cov=arenyxa.infrastructure.external_tools \
            --cov=arenyxa.application.headless_developer_access \
            --cov-report=json:coverage.json --cov-fail-under=0
          python scripts/critical_coverage_gate.py coverage.json

  windows-desktop:
    name: Windows desktop contracts
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      ARENYXA_CI_FORBID_ENVIRONMENT_SKIPS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install desktop capability lane
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,desktop,analysis,capture]"
      - name: Assert release tooling, Qt and process probe are present
        shell: pwsh
        run: python scripts/ci_environment_gate.py --require-static
      - name: Windows PowerShell 5.1 launch probe regression
        shell: powershell
        run: .\scripts\test_launch_probe.ps1
      - name: Windows process and Qt runtime contracts
        run: >-
          python -m pytest -q
          tests/test_v68_stability_hardening.py
          tests/test_ui_smoke.py
          tests/test_v71_page_runtime_contract.py
          tests/test_v71_page_runtime_hotfix.py
          tests/test_v71_main_window_import_contract.py
          tests/test_v66beta2_windows_native_qt_crash_hardening.py
          tests/test_v66beta2_windows_qt_header_hotfix.py
          tests/test_v68_windows_dpi_accessibility_compat.py
