name: Export Codex Source Snapshot

on:
  push:
    branches:
      - export/codex-v82-982c043

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Arenyxa release candidate
        uses: actions/checkout@v4
        with:
          ref: 982c0438574985ddb91b335eb611d49b25e640e2
          fetch-depth: 1

      - name: Verify immutable baseline and export tracked tree
        shell: bash
        run: |
          set -euo pipefail
          expected="982c0438574985ddb91b335eb611d49b25e640e2"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          mkdir -p export_artifacts
          archive="export_artifacts/Arenyxa_v8.2_release_982c043_Source.zip"
          git archive --format=zip --prefix=Arenyxa_v8.2_release_982c043/ -o "$archive" HEAD
          (cd export_artifacts && sha256sum "$(basename "$archive")" > SHA256SUMS.txt)
          printf 'repository=Arenyxa/Arenyxa\nbranch=release/v8.2\ncommit=%s\narchive_method=git archive\n' "$actual" > export_artifacts/CODEX_BASELINE.txt
          unzip -t "$archive"

      - name: Upload immutable source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: Arenyxa-v8.2-Codex-Source-982c043
          path: export_artifacts/*
          if-no-files-found: error
          retention-days: 1
