name: v8.2 PostgreSQL Pool Warmup Proof

on:
  push:
    branches: [release/v8.2]
    paths: [.github/workflows/v82-pg-pool-proof.yml]

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen
  ARENYXA_POSTGRES_TEST_DSN: postgresql://arenyxa:arenyxa_ci@127.0.0.1:5432/arenyxa_ci

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arenyxa
          POSTGRES_PASSWORD: arenyxa_ci
          POSTGRES_DB: arenyxa_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U arenyxa -d arenyxa_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v6
        with: {ref: release/v8.2, fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: "3.11", cache: pip}
      - name: Install
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-keysyms1 libxcb-xinerama0
          python -m pip install -e ".[dev,full]"
      - name: Configure PostgreSQL
        run: |
          C="$(docker ps --format '{{.ID}} {{.Image}}' | awk '$2 ~ /^postgres:/ {print $1; exit}')"
          docker exec "$C" psql -U arenyxa -d arenyxa_ci -c "ALTER SYSTEM SET max_connections='256';"
          docker restart "$C"
          for i in $(seq 1 30); do docker exec "$C" pg_isready -U arenyxa -d arenyxa_ci && break; sleep 2; done
          test "$(docker exec "$C" psql -U arenyxa -d arenyxa_ci -Atc 'SHOW max_connections;')" = 256
      - name: Apply candidate in working tree
        shell: python
        run: |
          from pathlib import Path
          def rep(path, old, new, count=1):
              p=Path(path); t=p.read_text(encoding='utf-8')
              if t.count(old)!=count: raise SystemExit(f'{path}: anchor {old!r} count={t.count(old)} expected={count}')
              p.write_text(t.replace(old,new),encoding='utf-8',newline='\n')
          # Fully warm the existing bounded capacity; max_size remains 8.
          rep('src/arenyxa/enterprise/runtime_storage.py','            min_size=4,\n            max_size=8,','            min_size=8,\n            max_size=8,')
          # Remove redundant client-side server-clock preflight round trips; atomic PostgreSQL SQL remains authoritative.
          rep('src/arenyxa/enterprise/runtime_storage_sql.py','heartbeat_at=GREATEST(w.heartbeat_at,?,EXTRACT(EPOCH FROM clock_timestamp())),updated_at=?','heartbeat_at=GREATEST(w.heartbeat_at,EXTRACT(EPOCH FROM clock_timestamp())),updated_at=?',2)
          rep('src/arenyxa/enterprise/runtime_storage_sql.py','lease_token_sha256=? AND lease_expires_at>GREATEST(?,EXTRACT(EPOCH FROM clock_timestamp()))','lease_token_sha256=? AND lease_expires_at>EXTRACT(EPOCH FROM clock_timestamp())',2)
          rep('src/arenyxa/enterprise/distributed_queue.py','                    lease_now = self._lease_now(connection)\n                    expires = lease_now + duration\n                    expiry_parameter = self._storage.fast_lease_expiry_parameter(lease_now, duration)\n','                    expires = 0.0\n                    expiry_parameter = self._storage.fast_lease_expiry_parameter(0.0, duration)\n')
          rep('src/arenyxa/enterprise/distributed_queue.py','                            worker,\n                            lease_now,\n                            now,\n','                            worker,\n                            now,\n')
          rep('src/arenyxa/enterprise/distributed_queue.py','                now = self._lease_now(connection)\n                updated_at = utc_now()\n','                updated_at = utc_now()\n')
          rep('src/arenyxa/enterprise/distributed_queue.py','                        str(job_id), str(worker_id), token_sha, now, updated_at,\n','                        str(job_id), str(worker_id), token_sha, updated_at,\n')
          rep('src/arenyxa/enterprise/distributed_queue.py','                now = self._lease_now(connection)\n                terminal_at = utc_now()\n','                terminal_at = utc_now()\n')
          rep('src/arenyxa/enterprise/distributed_queue.py','                        str(job_id), str(worker_id), token_sha, now,\n                        terminal_at, terminal_at, result_json, result_sha, str(worker_id), token_sha,\n                        now, utc_now(), str(worker_id),\n','                        str(job_id), str(worker_id), token_sha,\n                        terminal_at, terminal_at, result_json, result_sha, str(worker_id), token_sha,\n                        utc_now(), str(worker_id),\n')
          rep('tests/test_v811_long_horizon_invariants.py','    assert sql.count("?") == 18\n','    assert sql.count("?") == 16\n')
          rep('tests/test_v70_distributed_fault_matrix.py','"WHERE state=\'queued\' " + " AND ? IS NOT NULL" * 13 + " RETURNING *"','"WHERE state=\'queued\' " + " AND ? IS NOT NULL" * 12 + " RETURNING *"')
          rep('tests/test_v70_distributed_fault_matrix.py','"WHERE job_id=? AND state=\'leased\' " + " AND ? IS NOT NULL" * 9 + " RETURNING job_id"','"WHERE job_id=? AND state=\'leased\' " + " AND ? IS NOT NULL" * 8 + " RETURNING job_id"')
          rep('tests/test_v70_distributed_fault_matrix.py','"WHERE job_id=? AND state=\'running\' " + " AND ? IS NOT NULL" * 17 + " RETURNING state"','"WHERE job_id=? AND state=\'running\' " + " AND ? IS NOT NULL" * 15 + " RETURNING state"')
          # Regression: production pool must pre-warm its full bounded size, not grow on timed traffic.
          p=Path('tests/test_v82_postgresql_pool_warmup.py')
          p.write_text('''from pathlib import Path\n\n\ndef test_postgresql_pool_prewarms_full_bounded_capacity() -> None:\n    source = Path("src/arenyxa/enterprise/runtime_storage.py").read_text(encoding="utf-8")\n    block = source[source.index("pool = connection_pool("):source.index("opened = False", source.index("pool = connection_pool("))]\n    assert "min_size=8" in block\n    assert "max_size=8" in block\n    assert "max_size=9" not in block\n''',encoding='utf-8',newline='\n')
      - name: Regression and architecture proof
        run: |
          python -m pytest -q tests/test_v82_postgresql_pool_warmup.py tests/test_v70_distributed_fault_matrix.py::test_postgresql_fast_path_hooks_short_circuit_portable_fallback tests/test_v811_long_horizon_invariants.py::test_postgresql_lease_fencing_sql_uses_database_wall_clock tests/test_v811_long_horizon_invariants.py::test_postgresql_completion_fast_path_writes_tombstone_without_extra_binds
          python -m pytest -q tests/test_v78_p0_p1_closure.py tests/test_v70_distributed_fault_matrix.py tests/test_distributed_state_consistency_hardening.py tests/test_protocol_intelligence_depth.py tests/test_v78_architecture_consolidation.py --cov=arenyxa.enterprise.distributed_queue --cov=arenyxa.infrastructure.capture.tcp_reassembly --cov=arenyxa.application.async_runner --cov=arenyxa.infrastructure.external_tools --cov=arenyxa.application.headless_developer_access --cov-report=json:coverage.json --cov-fail-under=0
          python scripts/critical_coverage_gate.py coverage.json
          ruff check src/arenyxa/enterprise/runtime_storage.py src/arenyxa/enterprise/runtime_storage_sql.py src/arenyxa/enterprise/distributed_queue.py tests/test_v82_postgresql_pool_warmup.py --select F821,E9
          git diff --check
      - name: Real PostgreSQL release gate
        run: python scripts/postgresql_64_worker_128_concurrency_gate.py --dsn "$ARENYXA_POSTGRES_TEST_DSN" --jobs 1024 --p99-ms 500 --report POSTGRES_PERFORMANCE_RESULTS.json
      - name: Commit proven production repair
        run: |
          git config user.name "Arenyxa Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/v82-pg-fastpath-fix.yml .github/workflows/v82-pg-fastpath-fix-v2.yml .github/workflows/v82-pg-pool-proof.yml
          git add src/arenyxa/enterprise/runtime_storage.py src/arenyxa/enterprise/runtime_storage_sql.py src/arenyxa/enterprise/distributed_queue.py tests/test_v70_distributed_fault_matrix.py tests/test_v811_long_horizon_invariants.py tests/test_v82_postgresql_pool_warmup.py POSTGRES_PERFORMANCE_RESULTS.json
          git diff --cached --check
          git commit -m "perf: prewarm bounded PostgreSQL worker pools"
          git push origin HEAD:release/v8.2
