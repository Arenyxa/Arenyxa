name: v8.2 PostgreSQL Recovery Coordination Proof

on:
  push:
    branches: [release/v8.2]
    paths: [.github/workflows/v82-pg-pool-proof.yml]

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen
  ARENYXA_POSTGRES_TEST_DSN: postgresql://arenyxa:arenyxa_ci@127.0.0.1:5432/arenyxa_ci

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arenyxa
          POSTGRES_PASSWORD: arenyxa_ci
          POSTGRES_DB: arenyxa_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U arenyxa -d arenyxa_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v6
        with: {ref: release/v8.2, fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: "3.11", cache: pip}
      - name: Install
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-keysyms1 libxcb-xinerama0
          python -m pip install -e ".[dev,full]"
      - name: Configure PostgreSQL
        run: |
          C="$(docker ps --format '{{.ID}} {{.Image}}' | awk '$2 ~ /^postgres:/ {print $1; exit}')"
          docker exec "$C" psql -U arenyxa -d arenyxa_ci -c "ALTER SYSTEM SET max_connections='256';"
          docker restart "$C"
          for i in $(seq 1 30); do docker exec "$C" pg_isready -U arenyxa -d arenyxa_ci && break; sleep 2; done
          test "$(docker exec "$C" psql -U arenyxa -d arenyxa_ci -Atc 'SHOW max_connections;')" = 256
      - name: Apply candidate in working tree
        shell: python
        run: |
          from pathlib import Path

          def rep(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if text.count(old) != count:
                  raise SystemExit(f"{path}: anchor {old!r} count={text.count(old)} expected={count}")
              p.write_text(text.replace(old, new), encoding="utf-8", newline="\n")

          storage = "src/arenyxa/enterprise/runtime_storage.py"
          workers = "src/arenyxa/enterprise/distributed_queue_workers.py"

          # Warm the existing bounded pool; do not increase its upper bound.
          rep(storage, "            min_size=4,\n            max_size=8,", "            min_size=8,\n            max_size=8,")
          # Business SQL itself detects broken connections; explicit integrity_check still probes SELECT 1.
          rep(storage, "            check=self._check_pool_connection,\n", "")
          # Expose a credential-safe stable maintenance scope shared by independent clients of one DSN.
          rep(
              storage,
              "    def lease_admission_guard(self):\n        \"\"\"Bound backend-specific lease admission without changing portable storage.\"\"\"\n        return nullcontext()\n\n",
              "    def lease_admission_guard(self):\n        \"\"\"Bound backend-specific lease admission without changing portable storage.\"\"\"\n        return nullcontext()\n\n    def maintenance_scope_key(self) -> str:\n        \"\"\"Stable, non-secret scope for coordinating in-process backend maintenance.\"\"\"\n        target = str(getattr(self, \"dsn\", \"\"))\n        if target:\n            digest = hashlib.sha256(target.encode(\"utf-8\")).hexdigest()\n            return f\"{self.capabilities.backend}:{digest}\"\n        return f\"{self.capabilities.backend}:{id(self)}\"\n\n",
          )

          # Coordinate opportunistic external recovery across independent queue clients in one process.
          rep(workers, "import hmac\nimport time\n", "import hmac\nimport threading\nimport time\n")
          rep(
              workers,
              "MAX_WORKER_IDENTITY_METADATA_BYTES = 16 * 1024\n\n",
              "MAX_WORKER_IDENTITY_METADATA_BYTES = 16 * 1024\n\n_EXTERNAL_RECOVERY_COORDINATOR_LOCK = threading.Lock()\n_EXTERNAL_RECOVERY_LAST_BY_SCOPE: dict[str, float] = {}\n\n",
          )
          old_recovery = '''    def _recover_expired_leases_if_due(self) -> int:\n        \n        now = time.monotonic()\n        if now - self._last_expiry_scan_monotonic < self._expiry_scan_interval_seconds:\n            return 0\n        if not self._expiry_scan_lock.acquire(blocking=False):\n            return 0\n        try:\n            now = time.monotonic()\n            if now - self._last_expiry_scan_monotonic < self._expiry_scan_interval_seconds:\n                return 0\n            heartbeat_recovered = self.recover_stale_worker_leases()\n            return heartbeat_recovered + self.recover_expired_leases()\n        finally:\n            self._expiry_scan_lock.release()\n'''
          new_recovery = '''    def _recover_expired_leases_if_due(self) -> int:\n        now = time.monotonic()\n        shared_scope = \"\"\n        previous_shared = 0.0\n        claim_time = 0.0\n        if self._storage.capabilities.external_server:\n            shared_scope = self._storage.maintenance_scope_key()\n            with _EXTERNAL_RECOVERY_COORDINATOR_LOCK:\n                previous_shared = _EXTERNAL_RECOVERY_LAST_BY_SCOPE.get(shared_scope, 0.0)\n                effective_last = max(self._last_expiry_scan_monotonic, previous_shared)\n                if now - effective_last < self._expiry_scan_interval_seconds:\n                    return 0\n                claim_time = now\n                _EXTERNAL_RECOVERY_LAST_BY_SCOPE[shared_scope] = claim_time\n        elif now - self._last_expiry_scan_monotonic < self._expiry_scan_interval_seconds:\n            return 0\n\n        if not self._expiry_scan_lock.acquire(blocking=False):\n            if shared_scope:\n                with _EXTERNAL_RECOVERY_COORDINATOR_LOCK:\n                    if _EXTERNAL_RECOVERY_LAST_BY_SCOPE.get(shared_scope) == claim_time:\n                        _EXTERNAL_RECOVERY_LAST_BY_SCOPE[shared_scope] = previous_shared\n            return 0\n        try:\n            now = time.monotonic()\n            if not shared_scope and now - self._last_expiry_scan_monotonic < self._expiry_scan_interval_seconds:\n                return 0\n            heartbeat_recovered = self.recover_stale_worker_leases()\n            return heartbeat_recovered + self.recover_expired_leases()\n        except Exception:\n            if shared_scope:\n                with _EXTERNAL_RECOVERY_COORDINATOR_LOCK:\n                    if _EXTERNAL_RECOVERY_LAST_BY_SCOPE.get(shared_scope) == claim_time:\n                        _EXTERNAL_RECOVERY_LAST_BY_SCOPE[shared_scope] = previous_shared\n            raise\n        finally:\n            self._expiry_scan_lock.release()\n'''
          rep(workers, old_recovery, new_recovery)

          # PostgreSQL atomic SQL owns the authoritative server clock; remove redundant preflight round trips.
          rep("src/arenyxa/enterprise/runtime_storage_sql.py", "heartbeat_at=GREATEST(w.heartbeat_at,?,EXTRACT(EPOCH FROM clock_timestamp())),updated_at=?", "heartbeat_at=GREATEST(w.heartbeat_at,EXTRACT(EPOCH FROM clock_timestamp())),updated_at=?", 2)
          rep("src/arenyxa/enterprise/runtime_storage_sql.py", "lease_token_sha256=? AND lease_expires_at>GREATEST(?,EXTRACT(EPOCH FROM clock_timestamp()))", "lease_token_sha256=? AND lease_expires_at>EXTRACT(EPOCH FROM clock_timestamp())", 2)
          rep("src/arenyxa/enterprise/distributed_queue.py", "                    lease_now = self._lease_now(connection)\n                    expires = lease_now + duration\n                    expiry_parameter = self._storage.fast_lease_expiry_parameter(lease_now, duration)\n", "                    expires = 0.0\n                    expiry_parameter = self._storage.fast_lease_expiry_parameter(0.0, duration)\n")
          rep("src/arenyxa/enterprise/distributed_queue.py", "                            worker,\n                            lease_now,\n                            now,\n", "                            worker,\n                            now,\n")
          rep("src/arenyxa/enterprise/distributed_queue.py", "                now = self._lease_now(connection)\n                updated_at = utc_now()\n", "                updated_at = utc_now()\n")
          rep("src/arenyxa/enterprise/distributed_queue.py", "                        str(job_id), str(worker_id), token_sha, now, updated_at,\n", "                        str(job_id), str(worker_id), token_sha, updated_at,\n")
          rep("src/arenyxa/enterprise/distributed_queue.py", "                now = self._lease_now(connection)\n                terminal_at = utc_now()\n", "                terminal_at = utc_now()\n")
          rep("src/arenyxa/enterprise/distributed_queue.py", "                        str(job_id), str(worker_id), token_sha, now,\n                        terminal_at, terminal_at, result_json, result_sha, str(worker_id), token_sha,\n                        now, utc_now(), str(worker_id),\n", "                        str(job_id), str(worker_id), token_sha,\n                        terminal_at, terminal_at, result_json, result_sha, str(worker_id), token_sha,\n                        utc_now(), str(worker_id),\n")
          rep("tests/test_v811_long_horizon_invariants.py", "    assert sql.count(\"?\") == 18\n", "    assert sql.count(\"?\") == 16\n")
          rep("tests/test_v70_distributed_fault_matrix.py", "\"WHERE state='queued' \" + \" AND ? IS NOT NULL\" * 13 + \" RETURNING *\"", "\"WHERE state='queued' \" + \" AND ? IS NOT NULL\" * 12 + \" RETURNING *\"")
          rep("tests/test_v70_distributed_fault_matrix.py", "\"WHERE job_id=? AND state='leased' \" + \" AND ? IS NOT NULL\" * 9 + \" RETURNING job_id\"", "\"WHERE job_id=? AND state='leased' \" + \" AND ? IS NOT NULL\" * 8 + \" RETURNING job_id\"")
          rep("tests/test_v70_distributed_fault_matrix.py", "\"WHERE job_id=? AND state='running' \" + \" AND ? IS NOT NULL\" * 17 + \" RETURNING state\"", "\"WHERE job_id=? AND state='running' \" + \" AND ? IS NOT NULL\" * 15 + \" RETURNING state\"")

          Path("tests/test_v82_postgresql_recovery_coordination.py").write_text('''from __future__ import annotations\n\nimport threading\nfrom types import SimpleNamespace\n\nfrom arenyxa.enterprise import distributed_queue_workers as workers_module\nfrom arenyxa.enterprise.distributed_queue_workers import DistributedQueueWorkerMixin\n\n\nclass _Storage:\n    capabilities = SimpleNamespace(external_server=True)\n\n    def maintenance_scope_key(self) -> str:\n        return "postgresql:test-scope"\n\n\nclass _Probe(DistributedQueueWorkerMixin):\n    def __init__(self) -> None:\n        self._storage = _Storage()\n        self._last_expiry_scan_monotonic = 0.0\n        self._expiry_scan_interval_seconds = 60.0\n        self._expiry_scan_lock = threading.Lock()\n        self.stale_calls = 0\n        self.expired_calls = 0\n\n    def recover_stale_worker_leases(self) -> int:\n        self.stale_calls += 1\n        return 1\n\n    def recover_expired_leases(self) -> int:\n        self.expired_calls += 1\n        return 2\n\n\ndef test_external_clients_share_one_due_recovery_scan() -> None:\n    with workers_module._EXTERNAL_RECOVERY_COORDINATOR_LOCK:\n        workers_module._EXTERNAL_RECOVERY_LAST_BY_SCOPE.clear()\n    first = _Probe()\n    second = _Probe()\n    assert first._recover_expired_leases_if_due() == 3\n    assert second._recover_expired_leases_if_due() == 0\n    assert first.stale_calls == 1 and first.expired_calls == 1\n    assert second.stale_calls == 0 and second.expired_calls == 0\n\n\ndef test_external_failed_scan_releases_shared_cadence_claim() -> None:\n    with workers_module._EXTERNAL_RECOVERY_COORDINATOR_LOCK:\n        workers_module._EXTERNAL_RECOVERY_LAST_BY_SCOPE.clear()\n    first = _Probe()\n    second = _Probe()\n\n    def fail() -> int:\n        raise RuntimeError("synthetic recovery failure")\n\n    first.recover_stale_worker_leases = fail  # type: ignore[method-assign]\n    try:\n        first._recover_expired_leases_if_due()\n    except RuntimeError:\n        pass\n    else:\n        raise AssertionError("recovery failure did not propagate")\n    assert second._recover_expired_leases_if_due() == 3\n''', encoding="utf-8", newline="\n")

          Path("tests/test_v82_postgresql_pool_warmup.py").write_text('''from pathlib import Path\n\n\ndef _source() -> str:\n    return Path("src/arenyxa/enterprise/runtime_storage.py").read_text(encoding="utf-8")\n\n\ndef _pool_block() -> str:\n    source = _source()\n    start = source.index("pool = connection_pool(")\n    return source[start:source.index("opened = False", start)]\n\n\ndef test_postgresql_pool_prewarms_full_bounded_capacity() -> None:\n    block = _pool_block()\n    assert "min_size=8" in block\n    assert "max_size=8" in block\n    assert "max_size=9" not in block\n\n\ndef test_postgresql_hot_path_has_no_per_checkout_network_probe() -> None:\n    assert "check=self._check_pool_connection" not in _pool_block()\n    assert 'row = connection.execute("SELECT 1 AS healthy")' in _source()\n\n\ndef test_maintenance_scope_does_not_expose_postgresql_dsn() -> None:\n    source = _source()\n    assert "hashlib.sha256(target.encode" in source\n    assert "maintenance_scope_key" in source\n''', encoding="utf-8", newline="\n")
      - name: Regression and architecture proof
        run: |
          python -m pytest -q tests/test_v82_postgresql_pool_warmup.py tests/test_v82_postgresql_recovery_coordination.py tests/test_v70_distributed_fault_matrix.py::test_postgresql_fast_path_hooks_short_circuit_portable_fallback tests/test_v70_distributed_fault_matrix.py::test_storage_circuit_breaker_backpressures_then_opens_fail_closed tests/test_v811_long_horizon_invariants.py::test_postgresql_lease_fencing_sql_uses_database_wall_clock tests/test_v811_long_horizon_invariants.py::test_postgresql_completion_fast_path_writes_tombstone_without_extra_binds
          python -m pytest -q tests/test_v78_p0_p1_closure.py tests/test_v70_distributed_fault_matrix.py tests/test_distributed_state_consistency_hardening.py tests/test_protocol_intelligence_depth.py tests/test_v78_architecture_consolidation.py --cov=arenyxa.enterprise.distributed_queue --cov=arenyxa.infrastructure.capture.tcp_reassembly --cov=arenyxa.application.async_runner --cov=arenyxa.infrastructure.external_tools --cov=arenyxa.application.headless_developer_access --cov-report=json:coverage.json --cov-fail-under=0
          python scripts/critical_coverage_gate.py coverage.json
          ruff check src/arenyxa/enterprise/runtime_storage.py src/arenyxa/enterprise/runtime_storage_sql.py src/arenyxa/enterprise/distributed_queue.py src/arenyxa/enterprise/distributed_queue_workers.py tests/test_v82_postgresql_pool_warmup.py tests/test_v82_postgresql_recovery_coordination.py --select F821,E9
          git diff --check
      - name: Real PostgreSQL release gate
        run: python scripts/postgresql_64_worker_128_concurrency_gate.py --dsn "$ARENYXA_POSTGRES_TEST_DSN" --jobs 1024 --p99-ms 500 --report POSTGRES_PERFORMANCE_RESULTS.json
      - name: Commit proven production repair
        run: |
          git config user.name "Arenyxa Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/v82-pg-fastpath-fix.yml .github/workflows/v82-pg-fastpath-fix-v2.yml .github/workflows/v82-pg-pool-proof.yml
          git add src/arenyxa/enterprise/runtime_storage.py src/arenyxa/enterprise/runtime_storage_sql.py src/arenyxa/enterprise/distributed_queue.py src/arenyxa/enterprise/distributed_queue_workers.py tests/test_v70_distributed_fault_matrix.py tests/test_v811_long_horizon_invariants.py tests/test_v82_postgresql_pool_warmup.py tests/test_v82_postgresql_recovery_coordination.py POSTGRES_PERFORMANCE_RESULTS.json
          git diff --cached --check
          git commit -m "perf: coordinate PostgreSQL recovery hot path"
          git push origin HEAD:release/v8.2
