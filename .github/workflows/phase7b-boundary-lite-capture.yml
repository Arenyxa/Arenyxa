name: Arenyxa Phase7B Boundary-Lite Attribution

on:
  push:
    branches: ["phase7b/boundary-lite-independent-20260913"]
    paths: [".github/workflows/phase7b-boundary-lite-capture.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  ARENYXA_POSTGRES_TEST_DSN: postgresql://arenyxa:arenyxa_ci@127.0.0.1:5432/arenyxa_ci

jobs:
  boundary-lite-attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: arenyxa
          POSTGRES_PASSWORD: arenyxa_ci
          POSTGRES_DB: arenyxa_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U arenyxa -d arenyxa_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - name: Frozen source preflight
        run: |
          set -euo pipefail
          mkdir -p phase7b
          tar -tzf .github/phase2/timed-window-harness.tar.gz >/dev/null
          tar -xzf .github/phase2/timed-window-harness.tar.gz -C .github/phase2
          .github/phase2/experiment_preflight.sh phase7b
          git ls-files src | xargs sha256sum > phase7b/all-source-before.sha256
          git rev-parse HEAD > phase7b/diagnostic-head.txt
          cat /proc/sys/kernel/random/boot_id > phase7b/host-boot-id.txt
          { cat /proc/self/cgroup; test -r /sys/fs/cgroup/cpu.max && cat /sys/fs/cgroup/cpu.max || true; } > phase7b/cpu-quota.txt
          lscpu > phase7b/lscpu.txt
      - uses: actions/setup-python@v6
        with: {python-version: "3.11.16", cache: pip}
      - name: Install exact experiment dependencies
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev,database]" psutil==7.2.2
          python - <<'PY'
          import sys, psycopg, psycopg_pool
          assert sys.version_info[:3] == (3, 11, 16)
          assert psycopg.__version__ == '3.3.5'
          assert psycopg_pool.__version__ == '3.3.1'
          print('PSYCOPG_PQ_IMPL=' + str(psycopg.pq.__impl__))
          print('LIBPQ_VERSION=' + str(psycopg.pq.version()))
          PY
          python -m pip freeze > phase7b/dependencies.txt
      - name: Establish frozen PostgreSQL 16.15 safety contract
        run: .github/phase2/configure_pg.sh phase7b
      - name: Re-run Phase 7B TDD gate before capture
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/.github/phase7b:$GITHUB_WORKSPACE/.github/phase6:$GITHUB_WORKSPACE" \
            python -m pytest -c /dev/null -p no:cacheprovider -q .github/phase7b/test_boundary_lite*.py | tee phase7b/tdd-tests.txt
      - name: Calibrate Boundary-Lite and capture exactly 80 natural warm runs
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/.github/phase7b:$GITHUB_WORKSPACE/.github/phase6:$GITHUB_WORKSPACE" \
            python .github/phase7b/phase7b_capture.py --dsn "$ARENYXA_POSTGRES_TEST_DSN" --out phase7b --runs 80 | tee phase7b/capture.log
      - name: Offline pre/post decomposition
        if: always()
        run: |
          set -euo pipefail
          if test -f phase7b/verdict.json; then
            PYTHONPATH="$GITHUB_WORKSPACE/.github/phase7b" python .github/phase7b/phase7b_analyze.py --dir phase7b | tee phase7b/analysis.log
          fi
      - name: Final frozen-source recheck
        if: always()
        run: |
          set -euo pipefail
          .github/phase2/final_recheck.sh phase7b
          git ls-files src | xargs sha256sum > phase7b/all-source-after.sha256
          cmp phase7b/all-source-before.sha256 phase7b/all-source-after.sha256
          cp .github/phase7b/phase7b_lite_core.py .github/phase7b/phase7b_lite_observer.py \
             .github/phase7b/phase7b_lite_run.py .github/phase7b/phase7b_capture.py \
             .github/phase7b/phase7b_analyze.py .github/phase7b/test_boundary_lite.py \
             .github/phase7b/test_boundary_lite_hooks.py .github/phase7b/DESIGN.md phase7b/
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: phase7b-boundary-lite-attribution
          path: phase7b
          retention-days: 14
