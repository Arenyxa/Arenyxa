name: v8.2 PostgreSQL event commit proof

on:
  push:
    branches: ["release/v8.2-pg-event-commit-proof"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arenyxa
          POSTGRES_PASSWORD: arenyxa_ci
          POSTGRES_DB: arenyxa_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arenyxa -d arenyxa_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ARENYXA_POSTGRES_TEST_DSN: postgresql://arenyxa:arenyxa_ci@127.0.0.1:5432/arenyxa_ci
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,database]"
      - name: Configure PostgreSQL stress capacity
        shell: bash
        run: |
          C="$(docker ps --format '{{.ID}} {{.Image}}' | awk '$2 ~ /^postgres:/ {print $1; exit}')"
          test -n "$C"
          docker exec "$C" psql -U arenyxa -d arenyxa_ci -c "ALTER SYSTEM SET max_connections='256';"
          docker restart "$C"
          for i in $(seq 1 30); do docker exec "$C" pg_isready -U arenyxa -d arenyxa_ci && break; sleep 2; done
          test "$(docker exec "$C" psql -U arenyxa -d arenyxa_ci -Atc 'SHOW max_connections;')" = "256"
      - name: Apply diagnostic-only event trim removal
        shell: python
        run: |
          from pathlib import Path
          p = Path("src/arenyxa/enterprise/runtime_storage_sql.py")
          text = p.read_text(encoding="utf-8")
          old_blocks = [
          '''            ), trimmed AS (\n                DELETE FROM distributed_job_events\n                WHERE job_id=(SELECT job_id FROM event)\n                  AND event_id NOT IN (\n                      SELECT event_id FROM distributed_job_events\n                      WHERE job_id=(SELECT job_id FROM event)\n                      ORDER BY event_id DESC LIMIT ?\n                  )\n            )\n            SELECT * FROM leased''',
          '''            ), trimmed AS (\n                DELETE FROM distributed_job_events\n                WHERE job_id=(SELECT job_id FROM event)\n                  AND event_id NOT IN (\n                      SELECT event_id FROM distributed_job_events\n                      WHERE job_id=(SELECT job_id FROM event)\n                      ORDER BY event_id DESC LIMIT ?\n                  )\n            )\n            SELECT * FROM updated''',
          '''            ), trimmed AS (\n                DELETE FROM distributed_job_events\n                WHERE job_id=(SELECT job_id FROM event)\n                  AND event_id NOT IN (\n                      SELECT event_id FROM distributed_job_events\n                      WHERE job_id=(SELECT job_id FROM event)\n                      ORDER BY event_id DESC LIMIT ?\n                  )\n            )\n            SELECT c.state AS previous_state''',
          ]
          new_blocks = [
          '''            )\n            SELECT * FROM leased''',
          '''            )\n            SELECT * FROM updated''',
          '''            )\n            SELECT c.state AS previous_state''',
          ]
          for old, new in zip(old_blocks, new_blocks):
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one hot-path trim block, got {text.count(old)}")
              text = text.replace(old, new)
          p.write_text(text, encoding="utf-8", newline="\n")
      - name: Strict 64W 128C 1024-job gate, three fresh attempts
        shell: bash
        run: |
          set +e
          rc=0
          for n in 1 2 3; do
            python scripts/postgresql_64_worker_128_concurrency_gate.py --dsn "$ARENYXA_POSTGRES_TEST_DSN" --jobs 1024 --p99-ms 500 --report "PG_EVENT_TRIM_${n}.json"
            r=$?
            if [ "$r" -ne 0 ]; then rc=1; fi
          done
          exit "$rc"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pg-event-commit-proof
          path: PG_EVENT_TRIM_*.json
