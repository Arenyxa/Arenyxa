name: Arenyxa v8.1.1 Static Architecture Fix

on:
  push:
    branches: [v811-final-closure-prep]

permissions:
  contents: write

concurrency:
  group: arenyxa-v811-static-arch-fix
  cancel-in-progress: false

jobs:
  apply-verify-and-regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPECTED_RC_SHA: b620e9493a872e35cea4f2a6939bdff4f50d25eb
      PATCH_SHA256: DB4193AD426A0A5A80D69C7ED3416330C958BB8DACFB17469640CB721E878117
      RELEASE_BRANCH: release/v8.1.1-final
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reconstruct and authenticate architecture fix
        shell: bash
        run: |
          set -euo pipefail
          PATCH_RAW="$RUNNER_TEMP/v811-static-arch-fix.patch"
          export PATCH_RAW PATCH_SHA256
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          import os
          from pathlib import Path

          parts = [b''.join(p.read_bytes().split()) for p in sorted(Path('.release/v811-static-arch-fix-v2').glob('part*.b64'))]
          compact = b''.join(parts)
          expected = os.environ['PATCH_SHA256'].upper()
          target = Path(os.environ['PATCH_RAW'])
          print('part lengths:', [len(p) for p in parts], 'total:', len(compact))

          def check(candidate: bytes):
              try:
                  padded = candidate + b'=' * ((4 - len(candidate) % 4) % 4)
                  compressed = base64.b64decode(padded, validate=True)
                  raw = gzip.decompress(compressed)
              except Exception:
                  return None
              return raw if hashlib.sha256(raw).hexdigest().upper() == expected else None

          raw = check(compact)
          removed_at = None
          if raw is None:
              for i in range(len(compact)):
                  candidate = compact[:i] + compact[i + 1:]
                  raw = check(candidate)
                  if raw is not None:
                      removed_at = i
                      break
          if raw is None:
              raise SystemExit('Authenticated patch not recoverable by exact stream or one-character transport repair')
          target.write_bytes(raw)
          print('authenticated patch recovered; removed_at=', removed_at, 'bytes=', len(raw))
          PY
          ACTUAL="$(sha256sum "$PATCH_RAW" | awk '{print toupper($1)}')"
          echo "Expected patch SHA-256: $PATCH_SHA256"
          echo "Actual patch SHA-256:   $ACTUAL"
          test "$ACTUAL" = "$PATCH_SHA256"
          echo "PATCH_RAW=$PATCH_RAW" >> "$GITHUB_ENV"

      - name: Checkout exact release candidate and apply fix
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$RELEASE_BRANCH"
          git checkout -B "$RELEASE_BRANCH" "origin/$RELEASE_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_RC_SHA"
          test -z "$(git status --porcelain)"
          git apply --check "$PATCH_RAW"
          git apply --index "$PATCH_RAW"
          git diff --check --cached

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install release-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,database]"

      - name: Verify architecture ratchets and syntax
        shell: bash
        run: |
          set -euo pipefail
          python scripts/architecture_debt_gate.py
          python -m compileall -q src/arenyxa

      - name: Verify directly affected lifecycle and distributed regressions
        shell: bash
        run: >-
          python -m pytest -q
          tests/test_v811_long_horizon_invariants.py
          tests/test_job_system_shutdown_race.py
          tests/test_v811_lifecycle_windows_hardening.py
          tests/test_v80_industrialization_hardening.py
          tests/test_v70_distributed_fault_matrix.py

      - name: Regenerate final source repair trust chain
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_source_repair_seed.py
          python scripts/build_source_manifest.py
          python scripts/verify_v81_release_identity.py
          git add SOURCE_MANIFEST.sha256 src/arenyxa/resources/repair_manifest.json src/arenyxa/resources/repair_seed.zip
          git diff --check --cached

      - name: Commit verified source and trust chain atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Staged release changes:"
          git diff --cached --name-status
          git commit -m "refactor: satisfy v8.1.1 release architecture gates"
          FINAL_SHA="$(git rev-parse HEAD)"
          echo "FINAL_SHA=$FINAL_SHA" >> "$GITHUB_ENV"
          git push origin "HEAD:refs/heads/$RELEASE_BRANCH"
          echo "Updated $RELEASE_BRANCH to $FINAL_SHA"
