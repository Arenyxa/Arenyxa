name: Arenyxa Phase2 Timed Window Isolation

on:
  push:
    branches: ["phase2/timed-window-isolation-run-20260912"]
  workflow_dispatch:

permissions:
  contents: read

env:
  ARENYXA_POSTGRES_TEST_DSN: postgresql://arenyxa:arenyxa_ci@127.0.0.1:5432/arenyxa_ci

jobs:
  state-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: arenyxa
          POSTGRES_PASSWORD: arenyxa_ci
          POSTGRES_DB: arenyxa_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U arenyxa -d arenyxa_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}

      - name: Materialize verified diagnostic harness
        run: |
          set -euo pipefail
          tar -tzf .github/phase2/timed-window-harness.tar.gz >/dev/null
          tar -xzf .github/phase2/timed-window-harness.tar.gz -C .github/phase2

      - name: Apply diagnostic URI preservation and fail-closed backend guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/phase2/state_isolation_orchestrator.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'from typing import Any\n\nimport psycopg',
              'from typing import Any\nfrom urllib.parse import quote, urlsplit, urlunsplit\n\nimport psycopg',
          )
          old_db = '''    target = dict(info)\n    target["dbname"] = dbname\n    return make_conninfo(**target)\n'''
          new_db = '''    parsed = urlsplit(base_dsn)\n    return urlunsplit((parsed.scheme, parsed.netloc, "/" + quote(dbname, safe=""), parsed.query, parsed.fragment))\n'''
          if old_db not in s:
              raise SystemExit('expected diagnostic DB derivation block not found')
          s = s.replace(old_db, new_db)
          old_run = '''    subprocess.run(cmd, check=True, env={**os.environ, "PYTHONPATH": os.environ.get("GITHUB_WORKSPACE", os.getcwd())})\n    return json.loads(output.read_text(encoding="utf-8"))\n'''
          new_run = '''    subprocess.run(cmd, check=True, env={**os.environ, "PYTHONPATH": os.environ.get("GITHUB_WORKSPACE", os.getcwd())})\n    payload = json.loads(output.read_text(encoding="utf-8"))\n    result = payload.get("result") if isinstance(payload, dict) else None\n    if isinstance(result, dict):\n        backend = str((result.get("storage") or {}).get("backend", ""))\n        if backend != "postgresql":\n            raise RuntimeError(f"diagnostic state-isolation backend mismatch: {backend!r}")\n    return payload\n'''
          if old_run not in s:
              raise SystemExit('expected diagnostic run_script block not found')
          p.write_text(s.replace(old_run, new_run), encoding='utf-8')
          PY
          python3 -m py_compile .github/phase2/state_isolation_orchestrator.py .github/phase2/timed_state_isolation.py

      - name: Freeze host and source
        run: .github/phase2/experiment_preflight.sh phase2_state_isolation

      - uses: actions/setup-python@v6
        with: {python-version: "3.11", cache: pip}

      - name: Install fixed dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,database]" psutil
          python - <<'PY'
          import psycopg, psycopg_pool, psutil, sys
          assert sys.version_info[:3] == (3,11,16)
          assert psycopg.__version__ == '3.3.5'
          assert psycopg_pool.__version__ == '3.3.1'
          print('psycopg', psycopg.__version__, 'pool', psycopg_pool.__version__, 'psutil', psutil.__version__)
          PY

      - name: Configure PostgreSQL contract
        run: .github/phase2/configure_pg.sh phase2_state_isolation

      - name: Validate diagnostic harness after dependency install
        run: python -m py_compile .github/phase2/timed_state_isolation.py .github/phase2/state_isolation_orchestrator.py

      - name: Run A0 A1 A2 A3 PostgreSQL timed-window state isolation
        run: PYTHONPATH="$GITHUB_WORKSPACE" python .github/phase2/state_isolation_orchestrator.py --dsn "$ARENYXA_POSTGRES_TEST_DSN" --out phase2_state_isolation

      - name: Final frozen-state recheck
        if: always()
        run: .github/phase2/final_recheck.sh phase2_state_isolation

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: phase2-state-isolation-pg
          path: phase2_state_isolation
          retention-days: 7
