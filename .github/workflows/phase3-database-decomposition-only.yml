name: Arenyxa Phase3 Database Decomposition Only

on:
  push:
    branches: ["phase3/p99-db-decomposition-only-20260912"]
  workflow_dispatch:

permissions:
  contents: read

env:
  ARENYXA_POSTGRES_TEST_DSN: postgresql://arenyxa:arenyxa_ci@127.0.0.1:5432/arenyxa_ci

jobs:
  decompose:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: arenyxa
          POSTGRES_PASSWORD: arenyxa_ci
          POSTGRES_DB: arenyxa_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U arenyxa -d arenyxa_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - name: Materialize verified Phase2 diagnostic base
        run: |
          set -euo pipefail
          tar -tzf .github/phase2/timed-window-harness.tar.gz >/dev/null
          tar -xzf .github/phase2/timed-window-harness.tar.gz -C .github/phase2
      - name: Freeze host and source
        run: .github/phase2/experiment_preflight.sh phase3a_decomposition
      - uses: actions/setup-python@v6
        with: {python-version: "3.11", cache: pip}
      - name: Install fixed dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,database]" psutil
      - name: Configure service PostgreSQL contract for final recheck
        run: .github/phase2/configure_pg.sh phase3a_decomposition
      - name: Validate diagnostics
        run: python -m py_compile .github/phase3/phase3_db_decomp.py .github/phase3/phase3_decomposition_only.py .github/phase2/timed_state_isolation.py
      - name: Run S0 S1 S2 S3 S4 decomposition only
        run: PYTHONPATH="$GITHUB_WORKSPACE/.github/phase3:$GITHUB_WORKSPACE" python .github/phase3/phase3_decomposition_only.py --out phase3a_decomposition --replicates 3
      - name: Final frozen-state recheck
        if: always()
        run: .github/phase2/final_recheck.sh phase3a_decomposition
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: phase3-database-decomposition-only
          path: phase3a_decomposition
          retention-days: 7
