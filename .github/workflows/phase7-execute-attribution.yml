name: Arenyxa Phase7 Execute Wall Attribution

on:
  push:
    branches: ["phase7/execute-wall-attribution-20260913"]
    paths:
      - ".github/phase7/**"
      - ".github/workflows/phase7-execute-attribution.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  ARENYXA_POSTGRES_TEST_DSN: postgresql://arenyxa:arenyxa_ci@127.0.0.1:5432/arenyxa_ci

jobs:
  execute-attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: arenyxa
          POSTGRES_PASSWORD: arenyxa_ci
          POSTGRES_DB: arenyxa_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U arenyxa -d arenyxa_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}

      - name: Freeze source and host identity
        run: |
          set -euo pipefail
          mkdir -p phase7
          tar -tzf .github/phase2/timed-window-harness.tar.gz >/dev/null
          tar -xzf .github/phase2/timed-window-harness.tar.gz -C .github/phase2
          .github/phase2/experiment_preflight.sh phase7
          git ls-files src | xargs sha256sum > phase7/all-source-before.sha256
          git rev-parse HEAD > phase7/diagnostic-head.txt
          git rev-parse phase6/ordinary-lease-minimal-20260912 > phase7/phase6-parent-ref.txt || true
          cat /proc/sys/kernel/random/boot_id > phase7/host-boot-id.txt
          uname -a > phase7/uname.txt
          lscpu > phase7/lscpu.txt
          cat /proc/self/cgroup > phase7/cgroup.txt
          cat /proc/sys/kernel/sched_schedstats > phase7/sched_schedstats.txt 2>/dev/null || true
          cat /proc/thread-self/schedstat > phase7/schedstat-sample.txt 2>/dev/null || true
          {
            for f in /sys/fs/cgroup/cpu.max /sys/fs/cgroup/cpu/cpu.cfs_quota_us /sys/fs/cgroup/cpu/cpu.cfs_period_us /sys/fs/cgroup/cpu,cpuacct/cpu.cfs_quota_us /sys/fs/cgroup/cpu,cpuacct/cpu.cfs_period_us; do
              if test -r "$f"; then echo "$f"; cat "$f"; fi
            done
          } > phase7/cpu-quota.txt

      - uses: actions/setup-python@v6
        with: {python-version: "3.11.16", cache: pip}

      - name: Install frozen experiment dependencies
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev,database]"
          python - <<'PY'
          import sys, psycopg, psycopg_pool
          import psycopg.waiting as w
          assert sys.version_info[:3] == (3, 11, 16)
          assert psycopg.__version__ == '3.3.5'
          assert psycopg_pool.__version__ == '3.3.1'
          print('wait_impl', getattr(w.wait, '__name__', type(w.wait).__name__))
          PY
          python -m pip freeze > phase7/dependencies.txt

      - name: Establish unchanged PostgreSQL safety contract
        run: .github/phase2/configure_pg.sh phase7

      - name: Static diagnostic syntax and frozen source identity
        run: |
          set -euo pipefail
          python -m py_compile .github/phase7/phase7_attribution.py .github/phase7/phase7_analyze.py
          PYTHONPATH="$GITHUB_WORKSPACE/.github/phase6:$GITHUB_WORKSPACE/.github/phase7:$GITHUB_WORKSPACE" python - <<'PY'
          from pathlib import Path
          import phase6_trace
          print(phase6_trace.verify(Path('.')))
          PY

      - name: Calibrate then capture natural Phase7 runs
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/.github/phase6:$GITHUB_WORKSPACE/.github/phase7:$GITHUB_WORKSPACE" \
            python .github/phase7/phase7_attribution.py \
              --dsn "$ARENYXA_POSTGRES_TEST_DSN" --out phase7 --runs 40 --max-runs 80 --min-failures 2

      - name: Offline decomposition and controls
        if: always()
        run: |
          set -euo pipefail
          if test -f phase7/verdict.json && ls phase7/warm-*.json >/dev/null 2>&1; then
            python .github/phase7/phase7_analyze.py --in-dir phase7 --out phase7/analysis
          fi

      - name: Final source and gate recheck
        if: always()
        run: |
          set -euo pipefail
          .github/phase2/final_recheck.sh phase7
          git ls-files src | xargs sha256sum > phase7/all-source-after.sha256
          cmp phase7/all-source-before.sha256 phase7/all-source-after.sha256
          sha256sum \
            src/arenyxa/enterprise/runtime_storage.py \
            src/arenyxa/enterprise/distributed_queue.py \
            scripts/postgresql_32_worker_gate.py \
            scripts/postgresql_64_worker_128_concurrency_gate.py \
            > phase7/frozen-four-final.sha256
          cp .github/phase7/phase7_attribution.py .github/phase7/phase7_analyze.py .github/phase7/DESIGN.md phase7/

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: phase7-execute-wall-attribution
          path: phase7
          retention-days: 14
