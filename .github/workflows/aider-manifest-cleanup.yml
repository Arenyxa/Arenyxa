name: One-shot clean source manifest

on:
  push:
    branches:
      - fix/aider-manifest-pollution-20260902

permissions:
  contents: write

jobs:
  regenerate-clean-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove one-shot workflow before inventory generation
        run: git rm .github/workflows/aider-manifest-cleanup.yml

      - name: Regenerate source manifest from clean GitHub checkout
        run: python scripts/build_source_manifest.py

      - name: Verify Aider state is absent from manifest
        shell: bash
        run: |
          if grep -F '.aider' SOURCE_MANIFEST.sha256; then
            echo 'Aider state leaked into SOURCE_MANIFEST.sha256' >&2
            exit 1
          fi
          test -s SOURCE_MANIFEST.sha256

      - name: Commit regenerated manifest and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SOURCE_MANIFEST.sha256
          git commit -m 'fix(manifest): regenerate clean source inventory'
          git push origin HEAD:${{ github.ref_name }}
