name: Arenyxa Phase3 P99 Diagnostics

on:
  push:
    branches: ["phase3/disabled-during-plain-upload"]
  workflow_dispatch:

permissions:
  contents: read

env:
  ARENYXA_POSTGRES_TEST_DSN: postgresql://arenyxa:arenyxa_ci@127.0.0.1:5432/arenyxa_ci

jobs:
  track3a:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: arenyxa
          POSTGRES_PASSWORD: arenyxa_ci
          POSTGRES_DB: arenyxa_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U arenyxa -d arenyxa_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - name: Materialize verified diagnostic harness
        run: |
          echo "abbbbc32859bfb7da530349cffee854100d7752bcb159bc646d1c1b8ca8cbe5f  .github/phase3/phase3-harness.tar.gz" | sha256sum -c -
          tar -xzf .github/phase3/phase3-harness.tar.gz -C .github/phase3
      - name: Freeze host and source
        run: .github/phase3/experiment_preflight.sh phase3_track3a
      - uses: actions/setup-python@v6
        with: {python-version: "3.11", cache: pip}
      - name: Install fixed dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,database]" psutil
          python - <<'PY'
          import psycopg, psycopg_pool, psutil, sys
          assert sys.version_info[:3] == (3,11,16)
          assert psycopg.__version__ == '3.3.5'
          assert psycopg_pool.__version__ == '3.3.1'
          print('psycopg', psycopg.__version__, 'pool', psycopg_pool.__version__, 'psutil', psutil.__version__)
          PY
      - name: Configure PostgreSQL contract
        run: .github/phase3/configure_pg.sh phase3_track3a
      - name: Validate diagnostics
        run: python -m py_compile .github/phase3/variance_observer.py .github/phase3/timed_state_isolation.py .github/phase3/phase3_db_prep.py .github/phase3/phase3_track3a.py
      - name: Run paired A0 A1 replication and database-state decomposition
        run: PYTHONPATH="$GITHUB_WORKSPACE" python .github/phase3/phase3_track3a.py --dsn "$ARENYXA_POSTGRES_TEST_DSN" --out phase3_track3a
      - name: Final frozen-state recheck
        if: always()
        run: .github/phase3/final_recheck.sh phase3_track3a
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: phase3-track3a
          path: phase3_track3a
          retention-days: 7

  track3b:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: arenyxa
          POSTGRES_PASSWORD: arenyxa_ci
          POSTGRES_DB: arenyxa_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U arenyxa -d arenyxa_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - name: Materialize verified diagnostic harness
        run: |
          echo "abbbbc32859bfb7da530349cffee854100d7752bcb159bc646d1c1b8ca8cbe5f  .github/phase3/phase3-harness.tar.gz" | sha256sum -c -
          tar -xzf .github/phase3/phase3-harness.tar.gz -C .github/phase3
      - name: Freeze host and source
        run: .github/phase3/experiment_preflight.sh phase3_track3b
      - uses: actions/setup-python@v6
        with: {python-version: "3.11", cache: pip}
      - name: Install fixed dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,database]" psutil
          python - <<'PY'
          import psycopg, psycopg_pool, psutil, sys
          assert sys.version_info[:3] == (3,11,16)
          assert psycopg.__version__ == '3.3.5'
          assert psycopg_pool.__version__ == '3.3.1'
          PY
      - name: Configure PostgreSQL contract
        run: .github/phase3/configure_pg.sh phase3_track3b
      - name: Validate diagnostics
        run: python -m py_compile .github/phase3/phase3_warm_tail.py
      - name: Run warm-state profiler calibration and lease-tail attribution
        run: PYTHONPATH="$GITHUB_WORKSPACE" python .github/phase3/phase3_warm_tail.py --dsn "$ARENYXA_POSTGRES_TEST_DSN" --out phase3_track3b --max-runs 30
      - name: Final frozen-state recheck
        if: always()
        run: .github/phase3/final_recheck.sh phase3_track3b
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: phase3-track3b
          path: phase3_track3b
          retention-days: 7
