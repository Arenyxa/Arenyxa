name: Arenyxa Phase3 P99 Diagnostics

on:
  push:
    branches: ["phase3/p99-database-warmtail-20260912"]
  workflow_dispatch:

permissions:
  contents: read

env:
  ARENYXA_POSTGRES_TEST_DSN: postgresql://arenyxa:arenyxa_ci@127.0.0.1:5432/arenyxa_ci

jobs:
  track3a:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: arenyxa
          POSTGRES_PASSWORD: arenyxa_ci
          POSTGRES_DB: arenyxa_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U arenyxa -d arenyxa_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - name: Verify plain-text diagnostic harness identity
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/phase3.sha256 <<'EOF'
          ebf18ff7d2ef31431f486acb625ac94ea936bcf3d93d74a411016cf0894ec2d3  .github/phase3/variance_observer.py
          e6b392be241cbeac24b004aa38fca254e076d4af62c5e841c4f0e45430a0f854  .github/phase3/timed_state_isolation.py
          f829c6ae29abb076e9de8e1389e6e75789166c22fd814cd9e45ff53dcbe4f4f5  .github/phase3/phase3_db_prep.py
          640c05e7fb045569db182eae92ddb225b2ae3453f8a3c9dafb41284e8887e619  .github/phase3/phase3_track3a.py
          7ab3df6626c0da3b96498aa65054659d378149f5cea31cd37788b9f78f706d8c  .github/phase3/phase3_warm_tail.py
          e0285ca487814d1b1275484f973e1861275d55d247c621929ecc4c5ad9c7fc88  .github/phase3/experiment_preflight.sh
          85e4da54ff8261c0b42234731abf11d64078d05d439ad1fc8537518c4ba8e8f6  .github/phase3/configure_pg.sh
          1989de52f9f8dfa611a4a477545602dd7e9eb03d204ef24ef66b8e69bb8fc4ff  .github/phase3/final_recheck.sh
          19ae554643c7dfdd11d9af9a34deb0ed244daccd71aa3ab00a4bb8d3fbaca22d  .github/phase3/reconstructed-abg.patch
          EOF
          sha256sum -c /tmp/phase3.sha256
      - name: Apply audited diagnostic-only runtime fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('.github/phase3/phase3_track3a.py')
          s = p.read_text(encoding='utf-8')
          assert '"request_offset_ms"' in s and '"complete_offset_ms"' in s
          s = s.replace('"request_offset_ms"', '"start_offset_ms"').replace('"complete_offset_ms"', '"finish_offset_ms"')
          p.write_text(s, encoding='utf-8')

          p = Path('.github/phase3/phase3_warm_tail.py')
          s = p.read_text(encoding='utf-8')
          patterns = [
              'arenyxa_pool_health', 'eligible_worker', 'distributed_jobs',
              'distributed_job_idempotency', 'completed', 'started', 'distributed_workers'
          ]
          for pat in patterns:
              old = f"ILIKE '%{pat}%'"
              new = f"ILIKE '%%{pat}%%'"
              assert old in s, old
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
          echo "0dce244f1f218821b54c838dbe0a8e2e640bd05707bcc3e93b23175777e53f90  .github/phase3/phase3_track3a.py" | sha256sum -c -
          echo "c75026487612e4f55dfb7721fec3665c0e02637d25cfef059e1e0f4b20a6a168  .github/phase3/phase3_warm_tail.py" | sha256sum -c -
      - name: Freeze host and source
        run: bash .github/phase3/experiment_preflight.sh phase3_track3a
      - uses: actions/setup-python@v6
        with: {python-version: "3.11", cache: pip}
      - name: Install fixed dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,database]" psutil
          python - <<'PY'
          import psycopg, psycopg_pool, psutil, sys
          assert sys.version_info[:3] == (3,11,16)
          assert psycopg.__version__ == '3.3.5'
          assert psycopg_pool.__version__ == '3.3.1'
          print('psycopg', psycopg.__version__, 'pool', psycopg_pool.__version__, 'psutil', psutil.__version__)
          PY
      - name: Configure PostgreSQL contract
        run: bash .github/phase3/configure_pg.sh phase3_track3a
      - name: Validate diagnostics
        run: python -m py_compile .github/phase3/variance_observer.py .github/phase3/timed_state_isolation.py .github/phase3/phase3_db_prep.py .github/phase3/phase3_track3a.py
      - name: Run paired A0 A1 replication and database-state decomposition
        run: PYTHONPATH="$GITHUB_WORKSPACE" python .github/phase3/phase3_track3a.py --dsn "$ARENYXA_POSTGRES_TEST_DSN" --out phase3_track3a
      - name: Final frozen-state recheck
        if: always()
        run: bash .github/phase3/final_recheck.sh phase3_track3a
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: phase3-track3a
          path: phase3_track3a
          retention-days: 7

