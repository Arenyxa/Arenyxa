name: v8.2 PostgreSQL Coverage Diagnostic

on:
  push:
    branches:
      - release/v8.2
    paths:
      - .github/workflows/v82-pg-fastpath-fix-v2.yml

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/v8.2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-keysyms1 libxcb-xinerama0
          python -m pip install -e ".[dev,full]"
      - name: Apply candidate fast-path repair in working tree only
        shell: python
        run: |
          from pathlib import Path

          def once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f"{label}: anchor count={text.count(old)}")
              return text.replace(old, new, 1)

          sqlp = Path("src/arenyxa/enterprise/runtime_storage_sql.py")
          sql = sqlp.read_text(encoding="utf-8")
          old = "heartbeat_at=GREATEST(w.heartbeat_at,?,EXTRACT(EPOCH FROM clock_timestamp())),updated_at=?"
          if sql.count(old) != 2:
              raise SystemExit(f"heartbeat anchors={sql.count(old)}")
          sql = sql.replace(old, "heartbeat_at=GREATEST(w.heartbeat_at,EXTRACT(EPOCH FROM clock_timestamp())),updated_at=?")
          old = "lease_token_sha256=? AND lease_expires_at>GREATEST(?,EXTRACT(EPOCH FROM clock_timestamp()))"
          if sql.count(old) != 2:
              raise SystemExit(f"expiry anchors={sql.count(old)}")
          sql = sql.replace(old, "lease_token_sha256=? AND lease_expires_at>EXTRACT(EPOCH FROM clock_timestamp())")
          sqlp.write_text(sql, encoding="utf-8", newline="\n")

          qp = Path("src/arenyxa/enterprise/distributed_queue.py")
          q = qp.read_text(encoding="utf-8")
          q = once(q,
              "                    lease_now = self._lease_now(connection)\n                    expires = lease_now + duration\n                    expiry_parameter = self._storage.fast_lease_expiry_parameter(lease_now, duration)\n",
              "                    expires = 0.0\n                    expiry_parameter = self._storage.fast_lease_expiry_parameter(0.0, duration)\n",
              "lease preflight")
          q = once(q,
              "                            worker,\n                            lease_now,\n                            now,\n",
              "                            worker,\n                            now,\n",
              "lease bind")
          q = once(q,
              "                now = self._lease_now(connection)\n                updated_at = utc_now()\n",
              "                updated_at = utc_now()\n",
              "start preflight")
          q = once(q,
              "                        str(job_id), str(worker_id), token_sha, now, updated_at,\n",
              "                        str(job_id), str(worker_id), token_sha, updated_at,\n",
              "start bind")
          q = once(q,
              "                now = self._lease_now(connection)\n                terminal_at = utc_now()\n",
              "                terminal_at = utc_now()\n",
              "complete preflight")
          q = once(q,
              "                        str(job_id), str(worker_id), token_sha, now,\n                        terminal_at, terminal_at, result_json, result_sha, str(worker_id), token_sha,\n                        now, utc_now(), str(worker_id),\n",
              "                        str(job_id), str(worker_id), token_sha,\n                        terminal_at, terminal_at, result_json, result_sha, str(worker_id), token_sha,\n                        utc_now(), str(worker_id),\n",
              "complete binds")
          qp.write_text(q, encoding="utf-8", newline="\n")

          lp = Path("tests/test_v811_long_horizon_invariants.py")
          t = lp.read_text(encoding="utf-8")
          t = once(t, '    assert sql.count("?") == 18\n', '    assert sql.count("?") == 16\n', "completion test")
          lp.write_text(t, encoding="utf-8", newline="\n")

          fp = Path("tests/test_v70_distributed_fault_matrix.py")
          t = fp.read_text(encoding="utf-8")
          t = once(t, '"WHERE state=\'queued\' " + " AND ? IS NOT NULL" * 13 + " RETURNING *"', '"WHERE state=\'queued\' " + " AND ? IS NOT NULL" * 12 + " RETURNING *"', "lease synthetic")
          t = once(t, '"WHERE job_id=? AND state=\'leased\' " + " AND ? IS NOT NULL" * 9 + " RETURNING job_id"', '"WHERE job_id=? AND state=\'leased\' " + " AND ? IS NOT NULL" * 8 + " RETURNING job_id"', "start synthetic")
          t = once(t, '"WHERE job_id=? AND state=\'running\' " + " AND ? IS NOT NULL" * 17 + " RETURNING state"', '"WHERE job_id=? AND state=\'running\' " + " AND ? IS NOT NULL" * 15 + " RETURNING state"', "complete synthetic")
          fp.write_text(t, encoding="utf-8", newline="\n")
      - name: Run critical coverage and print exact missing lines
        run: |
          python -m pytest -q \
            tests/test_v78_p0_p1_closure.py \
            tests/test_v70_distributed_fault_matrix.py \
            tests/test_distributed_state_consistency_hardening.py \
            tests/test_protocol_intelligence_depth.py \
            tests/test_v78_architecture_consolidation.py \
            --cov=arenyxa.enterprise.distributed_queue \
            --cov=arenyxa.infrastructure.capture.tcp_reassembly \
            --cov=arenyxa.application.async_runner \
            --cov=arenyxa.infrastructure.external_tools \
            --cov=arenyxa.application.headless_developer_access \
            --cov-report=json:coverage.json --cov-fail-under=0
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('coverage.json').read_text())
          key=next(k for k in data['files'] if k.endswith('src/arenyxa/enterprise/distributed_queue.py'))
          f=data['files'][key]
          s=f['summary']
          print('DQ_SUMMARY', s)
          missing=f['missing_lines']
          print('DQ_MISSING_COUNT', len(missing))
          ranges=[]
          for n in missing:
              if not ranges or n != ranges[-1][1]+1:
                  ranges.append([n,n])
              else:
                  ranges[-1][1]=n
          print('DQ_MISSING_RANGES', ','.join(str(a) if a==b else f'{a}-{b}' for a,b in ranges))
          PY
