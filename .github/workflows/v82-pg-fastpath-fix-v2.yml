name: v8.2 PostgreSQL Fast Path Repair v2

on:
  push:
    branches:
      - release/v8.2
    paths:
      - .github/workflows/v82-pg-fastpath-fix-v2.yml

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen
  ARENYXA_POSTGRES_TEST_DSN: postgresql://arenyxa:arenyxa_ci@127.0.0.1:5432/arenyxa_ci

jobs:
  repair-and-prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arenyxa
          POSTGRES_PASSWORD: arenyxa_ci
          POSTGRES_DB: arenyxa_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arenyxa -d arenyxa_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/v8.2
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-keysyms1 libxcb-xinerama0
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,full]"
      - name: Configure PostgreSQL
        run: |
          C="$(docker ps --format '{{.ID}} {{.Image}}' | awk '$2 ~ /^postgres:/ {print $1; exit}')"
          test -n "$C"
          docker exec "$C" psql -U arenyxa -d arenyxa_ci -c "ALTER SYSTEM SET max_connections = '256';"
          docker restart "$C"
          for i in $(seq 1 30); do docker exec "$C" pg_isready -U arenyxa -d arenyxa_ci && break; sleep 2; done
          test "$(docker exec "$C" psql -U arenyxa -d arenyxa_ci -Atc 'SHOW max_connections;')" = "256"
      - name: Apply exact production repair and regression updates
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              return text.replace(old, new, 1)

          sql_path = Path("src/arenyxa/enterprise/runtime_storage_sql.py")
          sql = sql_path.read_text(encoding="utf-8")
          old = "heartbeat_at=GREATEST(w.heartbeat_at,?,EXTRACT(EPOCH FROM clock_timestamp())),updated_at=?"
          new = "heartbeat_at=GREATEST(w.heartbeat_at,EXTRACT(EPOCH FROM clock_timestamp())),updated_at=?"
          if sql.count(old) != 2:
              raise SystemExit(f"heartbeat server-clock binds: expected 2, found {sql.count(old)}")
          sql = sql.replace(old, new)
          old = "lease_token_sha256=? AND lease_expires_at>GREATEST(?,EXTRACT(EPOCH FROM clock_timestamp()))"
          new = "lease_token_sha256=? AND lease_expires_at>EXTRACT(EPOCH FROM clock_timestamp())"
          if sql.count(old) != 2:
              raise SystemExit(f"expiry server-clock binds: expected 2, found {sql.count(old)}")
          sql = sql.replace(old, new)
          sql_path.write_text(sql, encoding="utf-8", newline="\n")

          queue_path = Path("src/arenyxa/enterprise/distributed_queue.py")
          queue = queue_path.read_text(encoding="utf-8")
          queue = replace_once(
              queue,
              "                    lease_now = self._lease_now(connection)\n                    expires = lease_now + duration\n                    expiry_parameter = self._storage.fast_lease_expiry_parameter(lease_now, duration)\n",
              "                    # The PostgreSQL fast SQL owns the authoritative server clock; avoid a preflight round trip.\n                    expires = 0.0\n                    expiry_parameter = self._storage.fast_lease_expiry_parameter(0.0, duration)\n",
              "lease clock preflight",
          )
          queue = replace_once(
              queue,
              "                            worker,\n                            lease_now,\n                            now,\n",
              "                            worker,\n                            now,\n",
              "lease heartbeat bind",
          )
          queue = replace_once(
              queue,
              "                now = self._lease_now(connection)\n                updated_at = utc_now()\n",
              "                updated_at = utc_now()\n",
              "start clock preflight",
          )
          queue = replace_once(
              queue,
              "                        str(job_id), str(worker_id), token_sha, now, updated_at,\n",
              "                        str(job_id), str(worker_id), token_sha, updated_at,\n",
              "start expiry bind",
          )
          queue = replace_once(
              queue,
              "                now = self._lease_now(connection)\n                terminal_at = utc_now()\n",
              "                terminal_at = utc_now()\n",
              "complete clock preflight",
          )
          queue = replace_once(
              queue,
              "                        str(job_id), str(worker_id), token_sha, now,\n                        terminal_at, terminal_at, result_json, result_sha, str(worker_id), token_sha,\n                        now, utc_now(), str(worker_id),\n",
              "                        str(job_id), str(worker_id), token_sha,\n                        terminal_at, terminal_at, result_json, result_sha, str(worker_id), token_sha,\n                        utc_now(), str(worker_id),\n",
              "complete clock binds",
          )
          queue_path.write_text(queue, encoding="utf-8", newline="\n")

          long_path = Path("tests/test_v811_long_horizon_invariants.py")
          long = long_path.read_text(encoding="utf-8")
          long = replace_once(
              long,
              "    assert sql.count(\"?\") == 18\n",
              "    # The atomic statement reads the server clock itself; no preflight clock parameters remain.\n    assert sql.count(\"?\") == 16\n",
              "completion placeholder regression",
          )
          long_path.write_text(long, encoding="utf-8", newline="\n")

          fault_path = Path("tests/test_v70_distributed_fault_matrix.py")
          fault = fault_path.read_text(encoding="utf-8")
          fault = replace_once(fault, '"WHERE state=\'queued\' " + " AND ? IS NOT NULL" * 13 + " RETURNING *"', '"WHERE state=\'queued\' " + " AND ? IS NOT NULL" * 12 + " RETURNING *"', "lease synthetic binds")
          fault = replace_once(fault, '"WHERE job_id=? AND state=\'leased\' " + " AND ? IS NOT NULL" * 9 + " RETURNING job_id"', '"WHERE job_id=? AND state=\'leased\' " + " AND ? IS NOT NULL" * 8 + " RETURNING job_id"', "start synthetic binds")
          fault = replace_once(fault, '"WHERE job_id=? AND state=\'running\' " + " AND ? IS NOT NULL" * 17 + " RETURNING state"', '"WHERE job_id=? AND state=\'running\' " + " AND ? IS NOT NULL" * 15 + " RETURNING state"', "complete synthetic binds")
          lease_hook = '    monkeypatch.setattr(lease_queue._storage, "lease_next_fast_sql", lambda: lease_sql)\n'
          lease_hook_new = lease_hook + '    monkeypatch.setattr(lease_queue, "_lease_now", lambda _connection: (_ for _ in ()).throw(AssertionError("fast lease preflight clock query")))\n'
          fault = replace_once(fault, lease_hook, lease_hook_new, "lease no-preflight assertion")
          complete_hook = '    monkeypatch.setattr(queue._storage, "complete_fast_sql", lambda: complete_sql)\n'
          complete_hook_new = complete_hook + '    monkeypatch.setattr(queue, "_lease_now", lambda _connection: (_ for _ in ()).throw(AssertionError("fast state preflight clock query")))\n'
          fault = replace_once(fault, complete_hook, complete_hook_new, "start/complete no-preflight assertion")
          fault_path.write_text(fault, encoding="utf-8", newline="\n")

          patched_sql = sql_path.read_text(encoding="utf-8")
          if "GREATEST(?,EXTRACT(EPOCH FROM clock_timestamp()))" in patched_sql:
              raise SystemExit("redundant server-clock client bind remains")
          if patched_sql.count("clock_timestamp()") < 4:
              raise SystemExit("authoritative PostgreSQL server clock was removed")
      - name: Targeted regressions
        run: |
          python -m pytest -q \
            tests/test_v70_distributed_fault_matrix.py::test_postgresql_fast_path_hooks_short_circuit_portable_fallback \
            tests/test_v811_long_horizon_invariants.py::test_postgresql_lease_fencing_sql_uses_database_wall_clock \
            tests/test_v811_long_horizon_invariants.py::test_postgresql_completion_fast_path_writes_tombstone_without_extra_binds
      - name: Critical distributed coverage gate
        run: |
          python -m pytest -q \
            tests/test_v78_p0_p1_closure.py \
            tests/test_v70_distributed_fault_matrix.py \
            tests/test_distributed_state_consistency_hardening.py \
            tests/test_protocol_intelligence_depth.py \
            tests/test_v78_architecture_consolidation.py \
            --cov=arenyxa.enterprise.distributed_queue \
            --cov=arenyxa.infrastructure.capture.tcp_reassembly \
            --cov=arenyxa.application.async_runner \
            --cov=arenyxa.infrastructure.external_tools \
            --cov=arenyxa.application.headless_developer_access \
            --cov-report=json:coverage.json --cov-fail-under=0
          python scripts/critical_coverage_gate.py coverage.json
      - name: Real PostgreSQL 64-worker 128-concurrency release gate
        run: |
          python scripts/postgresql_64_worker_128_concurrency_gate.py --dsn "$ARENYXA_POSTGRES_TEST_DSN" --jobs 1024 --p99-ms 500 --report POSTGRES_PERFORMANCE_RESULTS.json
      - name: Static and diff verification
        run: |
          ruff check src/arenyxa/enterprise/distributed_queue.py src/arenyxa/enterprise/runtime_storage_sql.py tests/test_v70_distributed_fault_matrix.py tests/test_v811_long_horizon_invariants.py --select F821,E9
          git diff --check
      - name: Commit only after proof
        shell: bash
        run: |
          git config user.name "Arenyxa Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/v82-pg-fastpath-fix.yml .github/workflows/v82-pg-fastpath-fix-v2.yml
          git add src/arenyxa/enterprise/distributed_queue.py src/arenyxa/enterprise/runtime_storage_sql.py tests/test_v70_distributed_fault_matrix.py tests/test_v811_long_horizon_invariants.py POSTGRES_PERFORMANCE_RESULTS.json
          git diff --cached --check
          git commit -m "perf: remove redundant PostgreSQL fast-path clock trips"
          git push origin HEAD:release/v8.2
