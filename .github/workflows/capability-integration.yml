name: Arenyxa Capability Integration

on:
  workflow_dispatch:
  push:
    branches: ["release/**"]

permissions:
  contents: read

concurrency:
  group: arenyxa-capability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-capability-linux:
    name: PostgreSQL + TShark + Browser integration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      ARENYXA_CI_FORBID_ENVIRONMENT_SKIPS: "1"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: arenyxa
          POSTGRES_PASSWORD: arenyxa-ci
          POSTGRES_DB: arenyxa_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arenyxa -d arenyxa_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install native capability dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-keysyms1 libxcb-xinerama0 tshark
      - name: Install complete capability runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,full]"
          python -m playwright install chromium
      - name: Assert full capability environment
        run: python scripts/ci_environment_gate.py --require-static --require-tshark
      - name: PostgreSQL 32-worker tail-latency gate
        env:
          ARENYXA_POSTGRES_TEST_DSN: postgresql://arenyxa:arenyxa-ci@127.0.0.1:5432/arenyxa_ci
          ARENYXA_POSTGRES_32W_P99_MS: "350"
        run: python scripts/postgresql_32_worker_gate.py --workers 32 --jobs 512 --report POSTGRES_32_WORKER_GATE.json
      - name: Configure PostgreSQL stress capacity
        run: |
          POSTGRES_CONTAINER="$(docker ps --format '{{.ID}} {{.Image}}' | awk '$2 ~ /^postgres:/ {print $1; exit}')"
          test -n "$POSTGRES_CONTAINER"

          docker exec "$POSTGRES_CONTAINER" \
            psql -U arenyxa -d arenyxa_ci \
            -c "ALTER SYSTEM SET max_connections = '256';"

          docker restart "$POSTGRES_CONTAINER"

          READY=0
          for i in $(seq 1 30); do
            if docker exec "$POSTGRES_CONTAINER" \
              pg_isready -U arenyxa -d arenyxa_ci; then
              READY=1
              break
            fi
            sleep 2
          done

          test "$READY" -eq 1

          VALUE="$(docker exec "$POSTGRES_CONTAINER" \
            psql -U arenyxa -d arenyxa_ci -Atc "SHOW max_connections;")"

          echo "PostgreSQL max_connections=$VALUE"
          test "$VALUE" = "256"
      - name: PostgreSQL 64-worker 128-concurrency pool-storm gate
        env:
          ARENYXA_POSTGRES_TEST_DSN: postgresql://arenyxa:arenyxa-ci@127.0.0.1:5432/arenyxa_ci
          ARENYXA_POSTGRES_64W_128C_P99_MS: "500"
        run: python scripts/postgresql_64_worker_128_concurrency_gate.py --jobs 1024 --report POSTGRES_64W_128C_GATE.json
      - name: Native protocol differential validation against TShark
        run: python -m pytest -q tests/test_v71_protocol_differential_tshark.py
      - name: Full modern regression and quality gate
        run: python scripts/final_quality_gate.py --full

  frozen-win7-compatibility:
    name: Frozen Windows 7 compatibility lane
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install validation dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,analysis]"
      - name: Validate frozen legacy source lane only
        run: python scripts/win7_legacy_quality_gate.py
