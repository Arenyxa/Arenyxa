name: v8.2 PostgreSQL Clock Pool A-B Proof

on:
  push:
    branches: [release/v8.2]
    paths: [.github/workflows/v82-pg-worker-skiplocked-proof.yml]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen
  ARENYXA_POSTGRES_TEST_DSN: postgresql://arenyxa:arenyxa_ci@127.0.0.1:5432/arenyxa_ci

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arenyxa
          POSTGRES_PASSWORD: arenyxa_ci
          POSTGRES_DB: arenyxa_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U arenyxa -d arenyxa_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v6
        with: {ref: release/v8.2}
      - uses: actions/setup-python@v6
        with: {python-version: "3.11", cache: pip}
      - name: Install
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-keysyms1 libxcb-xinerama0
          python -m pip install -e ".[dev,full]"
      - name: Configure PostgreSQL diagnostics
        run: |
          C="$(docker ps --format '{{.ID}} {{.Image}}' | awk '$2 ~ /^postgres:/ {print $1; exit}')"
          docker exec "$C" psql -U arenyxa -d arenyxa_ci -c "ALTER SYSTEM SET max_connections='256';"
          docker exec "$C" psql -U arenyxa -d arenyxa_ci -c "ALTER SYSTEM SET shared_preload_libraries='pg_stat_statements';"
          docker exec "$C" psql -U arenyxa -d arenyxa_ci -c "ALTER SYSTEM SET track_io_timing='on';"
          docker restart "$C"
          for i in $(seq 1 30); do docker exec "$C" pg_isready -U arenyxa -d arenyxa_ci && break; sleep 2; done
          docker exec "$C" psql -U arenyxa -d arenyxa_ci -c "CREATE EXTENSION IF NOT EXISTS pg_stat_statements;"
      - name: Apply isolated candidate
        shell: python
        run: |
          from pathlib import Path
          def rep(path, old, new, count=1):
              p=Path(path); t=p.read_text(encoding='utf-8'); n=t.count(old)
              if n != count: raise SystemExit(f'{path}: anchor count={n} expected={count}: {old!r}')
              p.write_text(t.replace(old,new),encoding='utf-8',newline='\n')

          # Keep the existing maximum at eight connections per independent client,
          # but create all eight before the timed workload instead of growing 4->8
          # under load.  The gate has exactly eight execution threads per client.
          rep('src/arenyxa/enterprise/runtime_storage.py','            min_size=4,\n            max_size=8,','            min_size=8,\n            max_size=8,')
          # Pool checkout health checks add an extra network round trip to every
          # transaction. Broken sockets are still detected on first business I/O
          # and the existing retry/reconnect path remains fail-closed.
          rep('src/arenyxa/enterprise/runtime_storage.py','            check=self._check_pool_connection,\n','')

          # PostgreSQL atomic fast paths already use clock_timestamp(). Remove the
          # redundant pre-statement SELECT EXTRACT(EPOCH...) and its bind slots.
          rep('src/arenyxa/enterprise/runtime_storage_sql.py','heartbeat_at=GREATEST(w.heartbeat_at,?,EXTRACT(EPOCH FROM clock_timestamp())),updated_at=?','heartbeat_at=GREATEST(w.heartbeat_at,EXTRACT(EPOCH FROM clock_timestamp())),updated_at=?',2)
          rep('src/arenyxa/enterprise/runtime_storage_sql.py','lease_token_sha256=? AND lease_expires_at>GREATEST(?,EXTRACT(EPOCH FROM clock_timestamp()))','lease_token_sha256=? AND lease_expires_at>EXTRACT(EPOCH FROM clock_timestamp())',2)
          rep('src/arenyxa/enterprise/distributed_queue.py','                    lease_now = self._lease_now(connection)\n                    expires = lease_now + duration\n                    expiry_parameter = self._storage.fast_lease_expiry_parameter(lease_now, duration)\n','                    expires = 0.0\n                    expiry_parameter = self._storage.fast_lease_expiry_parameter(0.0, duration)\n')
          rep('src/arenyxa/enterprise/distributed_queue.py','                            worker,\n                            lease_now,\n                            now,\n','                            worker,\n                            now,\n')
          rep('src/arenyxa/enterprise/distributed_queue.py','                now = self._lease_now(connection)\n                updated_at = utc_now()\n','                updated_at = utc_now()\n')
          rep('src/arenyxa/enterprise/distributed_queue.py','                        str(job_id), str(worker_id), token_sha, now, updated_at,\n','                        str(job_id), str(worker_id), token_sha, updated_at,\n')
          rep('src/arenyxa/enterprise/distributed_queue.py','                now = self._lease_now(connection)\n                terminal_at = utc_now()\n','                terminal_at = utc_now()\n')
          rep('src/arenyxa/enterprise/distributed_queue.py','                        str(job_id), str(worker_id), token_sha, now,\n                        terminal_at, terminal_at, result_json, result_sha, str(worker_id), token_sha,\n                        now, utc_now(), str(worker_id),\n','                        str(job_id), str(worker_id), token_sha,\n                        terminal_at, terminal_at, result_json, result_sha, str(worker_id), token_sha,\n                        utc_now(), str(worker_id),\n')

          # Existing deterministic bind-shape regressions follow the removed
          # clock arguments; no behavior threshold is weakened.
          rep('tests/test_v811_long_horizon_invariants.py','    assert sql.count("?") == 18\n','    assert sql.count("?") == 16\n')
          rep('tests/test_v70_distributed_fault_matrix.py','"WHERE state=\'queued\' " + " AND ? IS NOT NULL" * 13 + " RETURNING *"','"WHERE state=\'queued\' " + " AND ? IS NOT NULL" * 12 + " RETURNING *"')
          rep('tests/test_v70_distributed_fault_matrix.py','"WHERE job_id=? AND state=\'leased\' " + " AND ? IS NOT NULL" * 9 + " RETURNING job_id"','"WHERE job_id=? AND state=\'leased\' " + " AND ? IS NOT NULL" * 8 + " RETURNING job_id"')
          rep('tests/test_v70_distributed_fault_matrix.py','"WHERE job_id=? AND state=\'running\' " + " AND ? IS NOT NULL" * 17 + " RETURNING state"','"WHERE job_id=? AND state=\'running\' " + " AND ? IS NOT NULL" * 15 + " RETURNING state"')
      - name: Regression proof
        run: |
          python - <<'PY'
          from arenyxa.enterprise.runtime_storage_sql import PostgreSQLFastSqlMixin
          lease = PostgreSQLFastSqlMixin.lease_next_fast_sql(object())
          start = PostgreSQLFastSqlMixin.start_job_fast_sql(object())
          complete = PostgreSQLFastSqlMixin.complete_fast_sql(object())
          assert 'GREATEST(?,EXTRACT(EPOCH FROM clock_timestamp()))' not in lease + start + complete
          assert lease.count('?') == 12
          assert start.count('?') == 9
          assert complete.count('?') == 16
          assert 'FOR UPDATE OF j SKIP LOCKED' in lease
          assert 'active_leases<max_slots\n                FOR UPDATE SKIP LOCKED' not in lease
          print('isolated clock/pool SQL contract: PASS')
          PY
          python -m pytest -q tests/test_v70_distributed_fault_matrix.py::test_postgresql_fast_path_hooks_short_circuit_portable_fallback tests/test_v70_distributed_fault_matrix.py::test_storage_circuit_breaker_backpressures_then_opens_fail_closed tests/test_v811_long_horizon_invariants.py::test_postgresql_lease_fencing_sql_uses_database_wall_clock tests/test_v811_long_horizon_invariants.py::test_postgresql_completion_fast_path_writes_tombstone_without_extra_binds
          ruff check src/arenyxa/enterprise/runtime_storage.py src/arenyxa/enterprise/runtime_storage_sql.py src/arenyxa/enterprise/distributed_queue.py --select F821,E9
          git diff --check
      - name: Three-run strict PostgreSQL A-B proof
        shell: bash
        run: |
          set -u
          C="$(docker ps --format '{{.ID}} {{.Image}}' | awk '$2 ~ /^postgres:/ {print $1; exit}')"
          failed=0
          for attempt in 1 2 3; do
            echo "===== STRICT ATTEMPT $attempt ====="
            docker exec "$C" psql -U arenyxa -d arenyxa_ci -c "SELECT pg_stat_statements_reset();"
            set +e
            python scripts/postgresql_64_worker_128_concurrency_gate.py --dsn "$ARENYXA_POSTGRES_TEST_DSN" --jobs 1024 --p99-ms 500 --report "POSTGRES_CLOCK_POOL_AB_${attempt}.json"
            rc=$?
            set -e
            cat "POSTGRES_CLOCK_POOL_AB_${attempt}.json"
            python - <<'PY'
          import os, psycopg
          dsn=os.environ['ARENYXA_POSTGRES_TEST_DSN']
          with psycopg.connect(dsn) as c:
              rows=c.execute('''
                  SELECT calls,round(total_exec_time::numeric,3),round(mean_exec_time::numeric,3),
                         round(max_exec_time::numeric,3),rows,left(regexp_replace(query, E'\\s+', ' ', 'g'),220)
                  FROM pg_stat_statements
                  WHERE query ILIKE '%distributed_jobs%' OR query ILIKE '%distributed_workers%'
                  ORDER BY total_exec_time DESC LIMIT 15
              ''').fetchall()
          print('PG_STAT_STATEMENTS_TOP')
          for row in rows: print(row)
          PY
            if [ "$rc" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"
