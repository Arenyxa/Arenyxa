name: Arenyxa Phase5 Natural Warm Zero SQL

on:
  push:
    branches: ["phase5/p99-natural-warm-zero-sql-20260912"]
  workflow_dispatch:

permissions:
  contents: read

env:
  ARENYXA_POSTGRES_TEST_DSN: postgresql://arenyxa:arenyxa_ci@127.0.0.1:5432/arenyxa_ci

jobs:
  natural-warm:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: arenyxa
          POSTGRES_PASSWORD: arenyxa_ci
          POSTGRES_DB: arenyxa_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U arenyxa -d arenyxa_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - name: Materialize verified Phase2 diagnostic base
        run: |
          set -euo pipefail
          tar -tzf .github/phase2/timed-window-harness.tar.gz >/dev/null
          tar -xzf .github/phase2/timed-window-harness.tar.gz -C .github/phase2
      - name: Decode Phase5 tracer
        run: |
          set -euo pipefail
          base64 -d .github/phase5/phase5_natural_warm.py.b64 > .github/phase5/phase5_natural_warm.py
          python -m py_compile .github/phase5/phase5_natural_warm.py
      - name: Freeze host and source
        run: .github/phase2/experiment_preflight.sh phase5
      - uses: actions/setup-python@v6
        with: {python-version: "3.11", cache: pip}
      - name: Install fixed dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,database]" psutil
          python - <<'PY'
          import psycopg, psycopg_pool, psutil, sys
          assert sys.version_info[:3] == (3,11,16)
          assert psycopg.__version__ == '3.3.5'
          assert psycopg_pool.__version__ == '3.3.1'
          print('psycopg', psycopg.__version__, 'pool', psycopg_pool.__version__, 'psutil', psutil.__version__)
          PY
      - name: Configure PostgreSQL contract
        run: .github/phase2/configure_pg.sh phase5
      - name: Run Phase5 natural warm characterization
        run: PYTHONPATH="$GITHUB_WORKSPACE" python .github/phase5/phase5_natural_warm.py --dsn "$ARENYXA_POSTGRES_TEST_DSN" --out phase5 --max-runs 60
      - name: Final frozen-state recheck
        if: always()
        run: .github/phase2/final_recheck.sh phase5
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: phase5-natural-warm-zero-sql
          path: phase5
          retention-days: 7
