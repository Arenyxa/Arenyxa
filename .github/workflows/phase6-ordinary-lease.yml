name: Arenyxa Phase6 Ordinary Lease Local Only

on:
  push:
    branches: ["phase6/ordinary-lease-local-only-20260912"]
    paths: [".github/phase6/**", ".github/workflows/phase6-ordinary-lease.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  ARENYXA_POSTGRES_TEST_DSN: postgresql://arenyxa:arenyxa_ci@127.0.0.1:5432/arenyxa_ci

jobs:
  ordinary-lease:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: arenyxa
          POSTGRES_PASSWORD: arenyxa_ci
          POSTGRES_DB: arenyxa_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U arenyxa -d arenyxa_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - name: Load existing frozen candidate preflight
        run: |
          set -euo pipefail
          tar -tzf .github/phase2/timed-window-harness.tar.gz >/dev/null
          tar -xzf .github/phase2/timed-window-harness.tar.gz -C .github/phase2
          .github/phase2/experiment_preflight.sh phase6
          git ls-files src | xargs sha256sum > phase6/all-source-before.sha256
          git rev-parse HEAD > phase6/diagnostic-head.txt
          cat /proc/sys/kernel/random/boot_id > phase6/host-boot-id.txt
          {
            cat /proc/self/cgroup
            for f in /sys/fs/cgroup/cpu.max /sys/fs/cgroup/cpu/cpu.cfs_quota_us /sys/fs/cgroup/cpu/cpu.cfs_period_us /sys/fs/cgroup/cpu,cpuacct/cpu.cfs_quota_us /sys/fs/cgroup/cpu,cpuacct/cpu.cfs_period_us; do
              if test -r "$f"; then echo "$f"; cat "$f"; fi
            done
          } > phase6/cpu-quota.txt
      - uses: actions/setup-python@v6
        with: {python-version: "3.11.16", cache: pip}
      - name: Install experiment dependencies
        run: |
          python -m pip install -e ".[dev,database]" psutil==7.2.2
          python - <<'PY'
          import sys, psycopg, psycopg_pool
          assert sys.version_info[:3] == (3, 11, 16)
          assert psycopg.__version__ == '3.3.5'
          assert psycopg_pool.__version__ == '3.3.1'
          PY
          python -m pip freeze > phase6/dependencies.txt
      - name: Establish unchanged PostgreSQL safety contract before experiment
        run: .github/phase2/configure_pg.sh phase6
      - name: Test diagnostic timing arithmetic and source identity
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE/.github/phase6:$GITHUB_WORKSPACE" python -m pytest -c /dev/null -p no:cacheprovider -q .github/phase6/test_phase6_math.py | tee phase6/tracer-tests.txt
      - name: Calibrate local-only observer then capture forty warm gates
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE/.github/phase6:$GITHUB_WORKSPACE" python .github/phase6/phase6_local_only.py --dsn "$ARENYXA_POSTGRES_TEST_DSN" --out phase6 --runs 40
      - name: Final source and gate recheck
        if: always()
        run: |
          set -euo pipefail
          .github/phase2/final_recheck.sh phase6
          git ls-files src | xargs sha256sum > phase6/all-source-after.sha256
          cmp phase6/all-source-before.sha256 phase6/all-source-after.sha256
          cp .github/phase6/phase6_trace.py .github/phase6/phase6_math.py .github/phase6/phase6_local_only.py .github/phase6/DESIGN.md phase6/
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: phase6-ordinary-lease-local-only
          path: phase6
          retention-days: 14
